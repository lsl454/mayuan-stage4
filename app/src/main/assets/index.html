<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>马原终极题库</title><style>:root{
  --bg:#F6F2FF; --ink:#2A1F45; --ink2:#645A7D; --ink3:#A59CBC; --line:#E9E2F7; --card:#FFFFFF;
  --vio:#7B61FF; --vio-d:#5B42E0; --vio-l:#EEE9FF;
  --mint:#1DBF94; --mint-d:#12997A; --mint-l:#DDF7EF;
  --coral:#FF6B6B; --coral-d:#E04B4B; --coral-l:#FFE7E7;
  --lemon:#FFC83D; --lemon-d:#E3A714; --lemon-l:#FFF4D4;
  --pink:#FF8FB1; --pink-d:#F06A94; --pink-l:#FFE9F1;
  --sky:#3AA8FF; --sky-d:#1C8AE0; --sky-l:#E2F2FF;
  --orange:#FF9F43; --orange-d:#E8822A; --orange-l:#FFF0E0;
  --cherry:#FF4F6D;
  --f:system-ui,-apple-system,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.65;
  -webkit-text-size-adjust:100%;overflow-x:hidden;
  background:
    radial-gradient(circle at 6% -4%,#FFE3EF 0,rgba(255,227,239,0) 38%),
    radial-gradient(circle at 104% 18%,#DFF1FF 0,rgba(223,241,255,0) 34%),
    radial-gradient(circle at 50% 108%,#FFF1D2 0,rgba(255,241,210,0) 42%),
    var(--bg);
  background-attachment:fixed}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
p{margin:0}
h1,h2,h3{margin:0;line-height:1.3}
:focus-visible{outline:3px solid var(--vio);outline-offset:2px;border-radius:10px}
#app{max-width:480px;margin:0 auto;padding:0 18px 40px;min-height:100vh}
#app.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}

/* ---------- 通用组件 ---------- */
.btn{--c:var(--vio);--d:var(--vio-d);appearance:none;border:0;font-weight:800;font-size:16px;color:#fff;
  background:var(--c);border-radius:16px;padding:13px 18px;box-shadow:0 4px 0 var(--d);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.3;
  transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--d)}
.btn:disabled{--c:#DAD4EA;--d:#C6BEDA;cursor:not-allowed}
.btn:disabled:active{transform:none;box-shadow:0 4px 0 var(--d)}
.btn.full{width:100%}
.b-mint{--c:var(--mint);--d:var(--mint-d)}
.b-coral{--c:var(--coral);--d:var(--coral-d)}
.b-lemon{--c:var(--lemon);--d:var(--lemon-d);color:var(--ink)}
.b-pink{--c:var(--pink);--d:var(--pink-d)}
.b-ghost{--c:#fff;--d:#E2DAF3;color:var(--ink)}
.btn-sm{padding:8px 13px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--d)}
.btn-sm:active{transform:translateY(3px)}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:#fff;display:grid;place-items:center;
  box-shadow:0 3px 0 #E2DAF3;cursor:pointer;color:var(--ink2);flex:none}
.ib svg{width:22px;height:22px}
.ib:active{transform:translateY(3px);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;padding:3px 10px;
  border-radius:999px;background:var(--vio-l);color:var(--vio-d);white-space:nowrap}
.c-xu{background:var(--sky-l);color:var(--sky-d)}
.c-zhe{background:var(--vio-l);color:var(--vio-d)}
.c-jing{background:var(--orange-l);color:var(--orange-d)}
.c-ke{background:var(--pink-l);color:var(--pink-d)}
.c-sa{background:var(--mint-l);color:var(--mint-d)}
.c-lun{background:var(--lemon-l);color:#B98300}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 12px 26px -18px rgba(91,66,224,.45)}

/* 顶栏 */
.tb{display:flex;align-items:center;gap:12px;padding:14px 0 10px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 78%,rgba(246,242,255,0))}
.tb h1{font-size:19px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-r{display:flex;gap:8px;align-items:center}

/* ---------- 吉祥物 马小原 ---------- */
.mascot{display:block;overflow:visible}
.mascot.big{width:128px;height:132px;animation:bob 3.4s ease-in-out infinite;transform-origin:50% 92%}
.mascot.mid{width:92px;height:95px}
.mascot.mini{width:58px;height:60px}
.mascot .e-happy,.mascot .mo-open,.mascot .mo-sad,.mascot .sweat,.mascot .stars{display:none}
.m-happy .e-norm,.m-cheer .e-norm{display:none}
.m-happy .e-happy,.m-cheer .e-happy{display:inline}
.m-happy .mo-smile,.m-cheer .mo-smile,.m-sad .mo-smile{display:none}
.m-happy .mo-open,.m-cheer .mo-open{display:inline}
.m-sad .mo-sad,.m-sad .sweat{display:inline}
.m-cheer .stars{display:inline;animation:twinkle .9s ease-in-out infinite}
.mascot .e-norm{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.mascot.m-happy{animation:hop .45s ease 2}
.mascot.m-cheer{animation:hop .45s ease 4}
.mascot.m-sad{animation:droop .9s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-14px) scale(.96,1.05)}65%{transform:translateY(0) scale(1.06,.94)}}
@keyframes droop{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}60%{transform:rotate(4deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- 首页 ---------- */
.hrow{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px}
.streak{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:7px 14px;
  font-weight:800;font-size:14px;box-shadow:0 3px 0 #E2DAF3;color:var(--ink3)}
.streak.on{color:var(--orange-d)}
.streak b{font-size:17px;color:inherit}
.hbtns{display:flex;gap:8px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:18px 2px 4px}
.board{position:relative;flex:none;width:152px;border:0;padding:0;background:#fff;border-radius:20px;
  text-align:center;cursor:pointer;box-shadow:0 16px 30px -16px rgba(255,79,109,.7),0 4px 0 #F2D3DB;
  transition:transform .12s}
.board:active{transform:translateY(3px) rotate(-1deg)}
.board::after{content:"";position:absolute;left:7px;right:7px;bottom:-7px;height:14px;background:#fff;
  border-radius:0 0 16px 16px;z-index:-1;box-shadow:0 4px 0 #F2D3DB}
.board .rings{position:absolute;top:-10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 34px}
.board .rings i{display:block;width:10px;height:22px;border-radius:6px;background:linear-gradient(#D8D0EC,#A399C2);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.board .bh{display:block;background:var(--cherry);color:#fff;font-weight:800;font-size:14px;
  padding:14px 8px 9px;border-radius:20px 20px 0 0;letter-spacing:.08em}
.board .bn{display:block;font-size:66px;font-weight:900;line-height:1;padding:14px 0 0;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.board .bn.q{color:var(--ink3)}
.board .bu{display:block;font-size:14px;color:var(--ink2);padding:4px 0 14px;font-weight:700}
.hm{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.say{position:relative;background:#fff;border-radius:16px;padding:9px 12px;font-size:13.5px;font-weight:700;
  line-height:1.45;margin-bottom:8px;box-shadow:0 8px 18px -12px rgba(91,66,224,.5);text-align:center;max-width:190px}
.say::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;
  border-bottom:0;border-top-color:#fff}
.lvbar{display:flex;align-items:center;gap:10px;margin:18px 0 0;background:#fff;border-radius:16px;padding:10px 14px;
  box-shadow:0 3px 0 #E8E1F6}
.lvt{font-weight:900;font-size:14px;white-space:nowrap}
.xpb{flex:1;height:10px;border-radius:99px;background:var(--vio-l);overflow:hidden}
.xpb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--vio),var(--pink));transition:width .8s}
.xpn{font-size:12.5px;color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.today{margin-top:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.sec-h h2{font-size:18px;font-weight:900}
.sec-h span{font-size:13px;color:var(--ink2);font-weight:700}
.rings3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.r3{background:#fff;border-radius:20px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;
  box-shadow:0 3px 0 #E8E1F6;position:relative}
.r3:active{transform:translateY(3px);box-shadow:none}
.r3 .rw{position:relative;width:62px;height:62px}
.r3 svg{width:62px;height:62px;transform:rotate(-90deg)}
.r3 .rt{fill:none;stroke:#F0EBFB;stroke-width:7}
.r3 .rv{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1)}
.r3 .ri{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.r3 .rl{font-size:13px;font-weight:800;margin-top:6px}
.r3 .rc{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.r3 .ok{position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--mint);color:#fff;
  font-size:13px;font-weight:900;display:grid;place-items:center}

.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{position:relative;border-radius:22px;padding:15px 15px 14px;min-height:118px;display:flex;flex-direction:column;
  justify-content:flex-end;overflow:hidden;box-shadow:0 4px 0 var(--td)}
.tile:active{transform:translateY(4px);box-shadow:0 0 0 var(--td)}
.tile .te{position:absolute;right:10px;top:8px;font-size:40px;line-height:1}
.tile .tt{font-size:17px;font-weight:900}
.tile .ts{font-size:12.5px;font-weight:700;opacity:.8}
.tile .tbar{height:6px;border-radius:9px;background:rgba(255,255,255,.55);margin-top:8px;overflow:hidden}
.tile .tbar i{display:block;height:100%;background:currentColor;border-radius:9px;opacity:.75}
.t-cards{grid-row:span 2;background:#E7E0FF;color:#4A33C4;--td:#CFC3FF;min-height:248px}
.t-cards .te{font-size:62px;right:auto;left:14px;top:14px}
.t-blitz{background:var(--lemon-l);color:#946A00;--td:#F6DE98}
.t-sq{background:var(--mint-l);color:#0C7A60;--td:#B5EBDB}
.t-exam{grid-column:span 2;background:#FFE2E6;color:#C2273F;--td:#FBC2CB;min-height:104px}
.t-exam .papers{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.t-exam .pp{background:rgba(255,255,255,.7);border-radius:10px;padding:3px 9px;font-size:12.5px;font-weight:800}
.mini3{grid-column:span 2;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile.sm{min-height:98px;padding:12px}
.tile.sm .te{font-size:30px;right:8px;top:8px}
.tile.sm .tt{font-size:15px}
.t-wrong{background:var(--coral-l);color:#C43838;--td:#F8C4C4}
.t-kit{background:var(--sky-l);color:#1172C2;--td:#BFE1FC}
.t-ach{background:var(--pink-l);color:#C8406E;--td:#F9C6D8}
.badge-n{position:absolute;top:8px;left:10px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;
  background:var(--coral);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center}

.pred{margin-top:18px;background:#fff;border-radius:22px;padding:16px;box-shadow:0 3px 0 #E8E1F6}
.pred-h{display:flex;align-items:baseline;justify-content:space-between}
.pred-h span{font-size:14px;font-weight:800;color:var(--ink2)}
.pred-h b{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.pred-h b small{font-size:14px;color:var(--ink2);margin-left:2px}
.pbar{position:relative;height:14px;border-radius:99px;background:#F1ECFB;margin:12px 0 8px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--lemon) 55%,var(--mint));transition:width 1s}
.pbar em{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:3px;font-style:normal}
.pbar em::after{content:"及格 60";position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;white-space:nowrap}
.pred p{font-size:12.5px;color:var(--ink2);line-height:1.55}

/* ---------- 闪卡 ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;background:#fff;
  color:var(--ink2);box-shadow:0 3px 0 #E8E1F6;cursor:pointer}
.fchip.on{background:var(--ink);color:#fff;box-shadow:0 3px 0 #120B24}
.fc-meta{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.fc-meta b{color:var(--ink)}
.deck{position:relative;height:360px;margin:6px 0 22px;perspective:1300px}
.fcard{position:absolute;inset:0;border-radius:26px}
.fcard.b1{transform:translateY(14px) scale(.95);background:#E3DBFF;box-shadow:0 10px 0 -4px #D5CAFF}
.fcard.b2{transform:translateY(26px) scale(.9);background:#D6CBFF}
.fcard.top{touch-action:pan-y;cursor:grab;transition:transform .32s cubic-bezier(.2,.9,.3,1.2),opacity .3s;z-index:2}
.fcard.top.in{animation:cardIn .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cardIn{from{transform:translateY(14px) scale(.95)}to{transform:none}}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.9,.3,1)}
.fcard.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;padding:22px 20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;overflow:hidden}
.face.front{background:#fff;box-shadow:0 18px 34px -20px rgba(91,66,224,.6)}
.face.front::before{content:"";position:absolute;right:-40px;bottom:-40px;width:170px;height:170px;border-radius:50%;background:var(--vio-l)}
.face.back{background:var(--ink);color:#fff;transform:rotateY(180deg);box-shadow:0 18px 34px -20px rgba(42,31,69,.8)}
.fq{position:relative;font-size:24px;font-weight:900;line-height:1.45;margin:16px 0 auto}
.fhint{position:relative;font-size:13px;color:var(--ink3);font-weight:700}
.fa{font-size:21px;font-weight:900;line-height:1.55;margin:6px 0 auto;color:#FFE07A}
.fa-l{font-size:12.5px;font-weight:800;color:#B9AEDA}
.fm{font-size:14px;line-height:1.6;color:#DCD4F5;border-top:1px dashed rgba(255,255,255,.25);padding-top:10px}
.stamp{position:absolute;top:26px;padding:4px 12px;border:3px solid;border-radius:12px;font-size:20px;font-weight:900;
  opacity:0;transform:rotate(-12deg);z-index:3;pointer-events:none;background:rgba(255,255,255,.9)}
.stamp.s-ok{left:18px;color:var(--mint);border-color:var(--mint)}
.stamp.s-no{right:18px;color:#D19300;border-color:var(--lemon);transform:rotate(12deg)}
.fc-act{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fc-done{text-align:center;padding:26px 10px}
.fc-done .mascot{margin:0 auto 10px}
.fc-done h2{font-size:22px;font-weight:900;margin-bottom:6px}
.fc-done .row{display:flex;gap:10px;justify-content:center;margin-top:18px}

/* ---------- 闪电战 ---------- */
.bz-hero{display:flex;align-items:center;gap:12px;background:var(--lemon-l);border-radius:22px;padding:14px 16px;margin-top:4px}
.bz-hero p{font-weight:800;font-size:15px;line-height:1.5}
.bz-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.bz-stats div{background:#fff;border-radius:18px;padding:11px 8px;text-align:center;box-shadow:0 3px 0 #E8E1F6}
.bz-stats b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.bz-stats span{font-size:12px;color:var(--ink2);font-weight:700}
.daygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 18px}
.dayb{border:0;background:#fff;border-radius:18px;padding:12px 14px;text-align:left;box-shadow:0 3px 0 #E8E1F6;cursor:pointer}
.dayb:active{transform:translateY(3px);box-shadow:none}
.dayb b{display:block;font-size:15px;font-weight:900}
.dayb span{font-size:12px;color:var(--ink2);font-weight:700}
.dots{display:flex;gap:5px;margin:2px 0 12px}
.dots i{flex:1;height:7px;border-radius:9px;background:#E7E0F6}
.dots i.ok{background:var(--mint)}
.dots i.bad{background:var(--coral)}
.dots i.cur{background:var(--vio)}
.combo{display:inline-flex;align-items:center;gap:4px;background:var(--lemon);color:var(--ink);border-radius:999px;
  padding:5px 12px;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--lemon-d)}
.combo.pop{animation:pop .35s ease}
.timer{height:8px;border-radius:9px;background:#EDE7FA;overflow:hidden;margin-bottom:14px;position:relative}
.timer i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:9px;background:var(--lemon);transform-origin:left}
.timer i.run{animation:drain 20s linear forwards}
@keyframes drain{0%{transform:scaleX(1);background:var(--lemon)}49%{background:var(--lemon)}50%{background:#CFC7E3}100%{transform:scaleX(0);background:#CFC7E3}}
.timer-l{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink3);margin:-8px 0 12px}
.qcard{background:#fff;border-radius:24px;padding:18px 16px 12px;box-shadow:0 14px 28px -20px rgba(91,66,224,.55)}
.qcard .qs{font-size:18.5px;font-weight:800;line-height:1.62;margin:10px 0 14px}
.opt{width:100%;display:flex;align-items:center;gap:12px;border:2px solid #EEE8FA;background:#FBFAFF;border-radius:16px;
  padding:10px 12px;margin-bottom:9px;text-align:left;cursor:pointer;font-size:16px;line-height:1.5;transition:border-color .2s,background .2s}
.opt:active{transform:scale(.985)}
.bub{position:relative;flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid #BDB3D6;display:grid;place-items:center;overflow:hidden;background:#fff}
.bub b{position:relative;z-index:1;font-weight:900;font-size:15px;color:var(--ink2)}
.bub::after{content:"";position:absolute;inset:-2px;border-radius:50%;transform:scale(0);
  background:repeating-linear-gradient(-38deg,rgba(255,255,255,0) 0 3px,rgba(255,255,255,.14) 3px 4px),var(--fill,var(--ink))}
.opt.picked .bub::after{animation:fill .3s ease-out forwards}
.opt.picked .bub b{color:#fff;transition:color .15s .12s}
@keyframes fill{0%{transform:scale(0) rotate(-25deg)}70%{transform:scale(1.1) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
.opt.ok{--fill:var(--mint);border-color:var(--mint);background:var(--mint-l)}
.opt.ok .bub{border-color:var(--mint)}
.opt.bad{--fill:var(--coral);border-color:var(--coral);background:var(--coral-l)}
.opt.bad .bub{border-color:var(--coral)}
.opt.right{border-color:var(--mint);background:var(--mint-l);animation:pulse .7s ease 2}
.opt.right .bub{border-color:var(--mint)}
.opt.right .bub b{color:var(--mint-d)}
.opt.ink{--fill:var(--ink);border-color:#CFC5EA;background:#F4F0FF}
.opt.ink .bub{border-color:var(--ink)}
.opt[disabled]{cursor:default}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}

","社会存在和社会意识的关系问题","哲学基本问题在社会领域的表现。"],["唯物史观","社会存在包括","物质资料生产方式、地理环境、人口因素","带「思想」二字的都属于社会意识。"],["唯物史观","对社会发展起决定作用的是","物质资料的生产方式","地理环境和人口只能影响、制约。2026 年 4 月第 10 题。"],["唯物史观","社会意识相对独立性的突出表现","对社会存在的能动反作用","另外两条：不完全同步性和不平衡性；历史继承性。"],["唯物史观","社会形态是什么的统一","经济基础和上层建筑的统一","「生产力和生产关系」是另一对，是陷阱。"],["唯物史观","整个上层建筑中居主导地位的","政治上层建筑","它的核心是国家政权。2026 年 4 月第 11 题。"],["唯物史观","衡量生产力水平的客观尺度","生产工具","最活跃的因素是劳动者，两个「最」别对调。"],["唯物史观","社会历史发展的基本动力","社会基本矛盾","阶级斗争、改革、科技革命都是动力，但不是「基本」动力。"],["唯物史观","承认必然性又承认主体选择","历史唯物主义","只认必然、否认选择是机械决定论。2026 年 4 月第 12 题。"],["政经","商品二因素和劳动二重性怎样对应","具体劳动创造使用价值\n抽象劳动形成价值","「创造」配使用价值，「形成」配价值。"],["政经","属于商品自然属性的因素","使用价值","价值是社会属性，反映人与人的关系。"],["政经","私有制商品经济的基本矛盾","私人劳动和社会劳动的矛盾","「二重性」是具体和抽象劳动，别混。"],["政经","价值量由什么决定？与劳动生产率什么关系","社会必要劳动时间决定；与劳动生产率成反比","与社会必要劳动时间成正比。"],["政经","货币最基本的两个职能","价值尺度和流通手段","其余三个是派生的。"],["政经","货币转化为资本的前提","劳动力成为商品","剩余价值理论的入口。"],["政经","资本主义生产方式的绝对规律","剩余价值规律","2026 年 4 月第 17 题。"],["政经","三种剩余价值怎样区分","延长工作日：绝对\n社会劳动生产率提高：相对\n个别企业效率更高：超额","关键看是「社会」还是「个别」。"],["政经","不变/可变资本、固定/流动资本的划分依据","前者按在价值增殖中的作用；后者按价值周转方式","同一台机器既是不变资本，又是固定资本。"],["政经","产业资本顺利循环的两个条件","三种职能形式空间上并存、时间上继起","空间并存，时间继起，别写反。2025 年 10 月简答第 28 题。"],["政经","生产价格等于","成本价格＋平均利润","它是商品价值的转化形式。"],["政经","平均利润率的分母","社会预付总资本","分母是可变资本的，是剩余价值率。"],["政经","经济危机周期的必经和基本阶段","危机阶段","四阶段：危机、萧条、复苏、高涨。"],["垄断","私人垄断资本主义形成的基础","生产集中和资本集中","「市场集中」「技术集中」都是干扰项。"],["垄断","垄断组织从松到紧","短期价格协定 → 卡特尔 → 辛迪加 → 托拉斯 → 康采恩 → 混合联合公司","最简单、最初级的是短期价格协定。"],["垄断","垄断利润的主要实现形式","垄断价格","卖时抬价，买时压价。"],["垄断","金融寡头怎样控制经济和国家","经济：参与制\n国家机器：同政府的「个人联合」","两个最容易对调。"],["垄断","资本输出按主体分、按形式分","主体：私人资本输出和国家资本输出\n形式：借贷资本输出和生产资本输出","2026 年 4 月第 22 题问的是主体。"],["垄断","二战后居主导地位的所有制形式","法人资本所有制","2025 年 10 月第 21 题。"],["垄断","经济全球化的主要表现","生产全球化、贸易全球化、金融全球化","只有三个。2025 年 10 月简答第 29 题。"],["科社","无产阶级夺取政权的第一次伟大尝试","巴黎公社","1871 年。尝试不等于成功。"],["科社","世界上第一个社会主义国家","苏维埃俄国","1917 年十月革命建立。"],["科社","展望未来社会：马克思主义与空想社会主义的根本区别","是否坚持科学的立场观点方法","马克思主义只揭示一般特征，不描绘细节。"],["科社","社会主义国家的最高政治领导力量","共产党","选项里的「社会党」是干扰项。"],["科社","最高理想和共同理想","最高理想：实现共产主义\n现阶段共同理想：建设中国特色社会主义","看到「最高」就是共产主义。"],["科社","共产主义社会的根本特征","实现人的自由而全面的发展","其余特征都对，但「根本」只有这一个。"],["科社","实现阶级消灭和国家消亡的社会","共产主义社会","社会主义阶段国家还存在。"],["科社","社会主义道路多样性的三条核心原因","生产力发展水平不同；历史文化传统不同；时代条件和国际环境不同","2026 年 4 月简答第 30 题。"]],"sq":[{"id":"b26","paper":"2026年4月","no":26,"type":"sa","max":6,"stem":"什么是价值观？我国社会主义核心价值观的基本内容是什么？","points":["关于价值的根本观点和评价标准","富强、民主、文明、和谐","自由、平等、公正、法治","爱国、敬业、诚信、友善"],"dis":["勤劳、节俭、孝顺、谦让","团结、奋斗、创新、奉献"],"full":"价值观是人们[[关于价值的根本观点和评价标准]]。社会主义核心价值观的基本内容：国家层面——[[富强、民主、文明、和谐]]；社会层面——[[自由、平等、公正、法治]]；公民层面——[[爱国、敬业、诚信、友善]]。","src":"资料参考答案","tip":"十二个词按国家、社会、公民三层记，每层四个。"},{"id":"b27","paper":"2026年4月","no":27,"type":"sa","max":6,"stem":"简要说明社会存在与社会意识的含义及相互关系。","points":["社会存在：社会生活的物质方面","社会意识：社会生活的精神方面","社会存在决定社会意识","社会意识有相对独立性并反作用于社会存在"],"dis":["社会意识决定社会存在","二者互不影响、各自发展"],"full":"[[社会存在]]是[[社会生活的物质方面]]，包括物质资料生产方式、地理环境、人口因素。[[社会意识]]是[[社会生活的精神方面]]，包括社会心理和思想体系。相互关系：①[[社会存在决定社会意识]]；②社会意识对社会存在具有[[相对独立性]]，并能[[反作用于社会存在]]。","src":"资料参考答案","tip":"含义各一句；关系必须写两条，决定加反作用，只写「决定」会丢分。"},{"id":"b28","paper":"2026年4月","no":28,"type":"sa","max":6,"stem":"简述生产价格的形成过程。","points":["剩余价值转化为利润","利润转化为平均利润","成本价格＋平均利润＝生产价格","生产价格是商品价值的转化形式"],"dis":["价格转化为价值","平均利润转化为剩余价值"],"full":"①[[剩余价值转化为利润]]；②[[利润转化为平均利润]]；③[[成本价格与平均利润之和构成生产价格]]；④生产价格是[[商品价值的转化形式]]。","src":"资料参考答案","tip":"一条转化链，按顺序写：剩余价值 → 利润 → 平均利润 → 生产价格。"},{"id":"b29","paper":"2026年4月","no":29,"type":"sa","max":6,"stem":"第二次世界大战后资本主义发生了一系列新变化，其主要表现有哪些？这是否意味着资本主义本质的改变？","points":["生产资料所有制的变化","劳资关系和分配关系的变化","社会阶层和阶级结构的变化","经济调节机制和经济危机形态的变化","政治制度的变化","没有改变资本主义的本质"],"dis":["资本主义私有制已经消失","剥削关系已经不存在"],"full":"主要表现：①[[生产资料所有制的变化]]（国家资本所有制、法人资本所有制发展）；②[[劳资关系和分配关系的变化]]（职工参与决策、福利制度等）；③[[社会阶层和阶级结构的变化]]；④[[经济调节机制和经济危机形态的变化]]；⑤[[政治制度的变化]]。这些变化是在资本主义制度框架内的调整，[[没有改变资本主义的本质]]：私有制和剥削关系依然存在，[[基本矛盾没有消除]]。","src":"按教材章节整理（资料答案较简略）","tip":"先答「有哪些变化」，再答「是否改变本质」。第二问的结论必须写：没有改变。"},{"id":"b30","paper":"2026年4月","no":30,"type":"sa","max":6,"stem":"简述社会主义发展道路多样性的原因。","points":["各国生产力发展水平不同","历史文化传统不同","时代条件和国际环境不同","人民群众实践探索的创造性"],"dis":["社会主义的本质各不相同","马克思主义基本原理已经过时"],"full":"①各国[[生产力发展水平]]和经济社会发展状况不同；②[[历史文化传统]]存在差异；③所处的[[时代条件与国际环境]]不同；④[[人民群众的实践探索]]具有创造性；⑤马克思主义基本原理与各国实际[[相结合的路径]]不同。","src":"资料参考答案","tip":"前三条（生产力水平、历史文化、时代与国际环境）是核心，一定写；后两条有时间再补。"},{"id":"b31","paper":"2026年4月","no":31,"type":"lun","max":10,"stem":"把主要矛盾和次要矛盾、矛盾的主要方面和次要方面的辩证关系运用到实际工作中，就是要坚持「两点论」和「重点论」的统一。试述「两点论」和「重点论」统一的原理及其现实意义。","points":["两点论：兼顾主次矛盾和主次方面","重点论：着重把握主要矛盾和主要方面","两点是有重点的两点，重点是两点中的重点","正确认识和解决社会主要矛盾","工作中抓住关键环节","反对均衡论和一点论"],"dis":["只抓主要矛盾，其余不管","各方面平均用力"],"full":"原理：「[[两点论]]」是指看问题要[[兼顾主要矛盾和次要矛盾、矛盾的主要方面和次要方面]]；「[[重点论]]」是指在兼顾两点的前提下，[[着重把握主要矛盾和矛盾的主要方面]]；二者统一：[[两点是有重点的两点，重点是两点中的重点]]。\n现实意义：①正确认识和解决[[社会主要矛盾]]（如新时代人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾）；②指导经济、政治、文化等各领域工作，[[抓住关键环节]]；③[[反对均衡论和一点论]]，提高辩证思维能力；④在复杂局面中清醒判断主次，科学决策。","src":"资料参考答案","tip":"原理三句加意义三句，正好是论述题的两段式。"},{"id":"b32","paper":"2026年4月","no":32,"type":"lun","max":10,"stem":"试述商品经济中商品价值量的决定及其与劳动生产率的关系。","points":["由社会必要劳动时间决定","正常生产条件、平均熟练程度和劳动强度","单位商品价值量与劳动生产率成反比","单位时间创造的价值总量不变"],"dis":["价值量与劳动生产率成正比","价值量由个别劳动时间决定"],"full":"价值量的决定：商品的价值量由生产商品的[[社会必要劳动时间]]决定。社会必要劳动时间是在[[现有的社会正常的生产条件]]下，在[[社会平均的劳动熟练程度和劳动强度]]下，制造某种使用价值所需要的劳动时间。\n与劳动生产率的关系：①劳动生产率越高，[[单位商品的价值量越小]]，二者[[成反比]]；②单位时间内生产的使用价值量增加，但[[创造的价值总量不变]]；③个别企业提高劳动生产率可以获得超额剩余价值；④社会劳动生产率普遍提高，会使单位商品价值量下降。","src":"资料参考答案","tip":"第一段写清「社会必要劳动时间」的定义，第二段一句「成反比」再加解释。"},{"id":"b33","paper":"2026年4月","no":33,"type":"lun","max":10,"stem":"如何理解资本主义的历史进步性？其主要表现是什么？","points":["取代封建主义是历史的巨大进步","生产力空前发展","促进世界市场形成与经济全球化","推动民主法治等政治文明进步","为社会主义准备物质条件和社会力量"],"dis":["彻底消灭了剥削","实现了人的全面发展"],"full":"历史进步性：资本主义[[取代封建主义是历史的巨大进步]]。主要表现：①[[生产力空前发展]]：机械化、工业化、科技革命；②促进了[[世界市场的形成与经济全球化]]；③推动了[[民主、法治、自由等政治文明进步]]；④打破了封建等级制度，在一定程度上促进了人的解放；⑤为社会主义的产生准备了[[物质条件和社会力量]]（无产阶级）。","src":"资料参考答案","tip":"先一句定性，再列表现。最后一条「为社会主义准备条件」是点睛，别漏。"},{"id":"a26","paper":"2025年10月","no":26,"type":"sa","max":6,"stem":"简述马克思主义的基本特征。","points":["科学性","人民性","实践性","发展性","科学性与革命性的统一"],"dis":["阶级性","民族性"],"full":"马克思主义具有鲜明的[[科学性]]、[[人民性]]、[[实践性]]、[[发展性]]，这些特征体现了马克思主义的本质和使命，也展现出马克思主义的理论形象。马克思主义的基本特征，用一句话来概括就是[[科学性与革命性的统一]]。","src":"参考答案，教材 P13","tip":"四个「性」背熟，最后补一句总括「科学性与革命性的统一」。"},{"id":"a27","paper":"2025年10月","no":27,"type":"sa","max":6,"stem":"如何理解真理和谬误的关系？","points":["既对立又统一","确定范围内对立是绝对的","真理可转化为谬误","谬误可转化为真理","在批判谬误中发展真理"],"dis":["真理与谬误没有界限","谬误永远不会变成真理"],"full":"它们之间[[既对立又统一]]。（1）二者相互对立。在确定的对象和范围内，真理与谬误的[[对立是绝对的]]，与对象相符合的认识就是真理，与对象不相符合的认识就是谬误。（2）二者的对立又是相对的，它们[[在一定条件下能够相互转化]]。①[[真理在一定条件下会转化为谬误]]：任何真理都只在一定范围内、一定条件下才能成立，超出这个范围，失去特定条件，就会变成谬误。②[[谬误在一定条件下能够向真理转化]]：勇于正视、反省、修正错误，终能让谬误转化为真理。③[[在批判谬误中发展真理]]，是谬误向真理转化的另一种形式。","src":"参考答案，教材 P98","tip":"先下结论「既对立又统一」，再分「对立」「转化」两层写，转化那层有三小点。"},{"id":"a28","paper":"2025年10月","no":28,"type":"sa","max":6,"stem":"简述产业资本的运动中，实现资本顺利循环必须具备的两个基本前提条件。","points":["三种职能形式在空间上并存","三种职能形式在时间上继起","按比例同时存在于三种形式","转化保持时间上的依次连续"],"dis":["三种职能形式在时间上并存","三种职能形式在空间上继起"],"full":"产业资本的运动，必须具备两个基本前提条件：一是产业资本的三种职能形式必须[[在空间上并存]]，也就是说，产业资本必须[[按照一定比例同时存在]]于货币资本、生产资本和商品资本三种形式中。二是产业资本的三种职能形式必须[[在时间上继起]]，也就是说，产业资本循环中三种职能形式的转化必须保持[[时间上的依次连续性]]。","src":"参考答案，教材 P220","tip":"口诀：空间并存，时间继起。最常见的丢分是把「空间」「时间」写反。"},{"id":"a29","paper":"2025年10月","no":29,"type":"sa","max":6,"stem":"经济全球化的内涵和主要表现是什么？","points":["各国经济相互联系、相互依赖的过程","生产全球化","贸易全球化","金融全球化"],"dis":["文化全球化","政治全球化"],"full":"（1）内涵：经济全球化是指在生产不断发展、科技加速进步、社会分工和国际分工不断深化、生产的社会化和国际化程度不断提高的情况下，世界各国、各地区的经济活动[[越来越超出一国和地区的范围]]而[[相互联系、相互依赖的过程]]。（2）主要表现：①[[生产全球化]]；②[[贸易全球化]]；③[[金融全球化]]。","src":"参考答案，教材 P256—P258","tip":"表现只有三个：生产、贸易、金融。内涵那句长，至少写出「超出一国范围、相互联系相互依赖的过程」。"},{"id":"a30","paper":"2025年10月","no":30,"type":"sa","max":6,"stem":"简述马克思主义经典作家预见未来社会的方法论原则。","points":["揭示社会发展一般规律，指明方向","剖析旧世界中阐发新世界特点","在社会主义发展中深化认识","只揭示一般特征，不描绘细节"],"dis":["详细设计未来社会的蓝图","从理性原则出发构想理想社会"],"full":"（1）在[[揭示人类社会发展一般规律]]的基础上指明社会发展的方向。（2）在[[剖析资本主义旧世界]]的过程中阐发未来新世界的特点。（3）在[[社会主义社会发展中不断深化]]对未来共产主义社会的认识。（4）立足于[[揭示未来社会的一般特征]]，而[[不对各种细节作具体描绘]]。","src":"参考答案，教材 P329","tip":"第四条是马克思主义和空想社会主义的分水岭，2026 年 4 月第 24 题选择题也考了它。"},{"id":"a31","paper":"2025年10月","no":31,"type":"lun","max":10,"stem":"试述矛盾的普遍性、矛盾的特殊性的含义以及分析矛盾的特殊性的意义。","points":["普遍性：无处不在、无时不有","特殊性：各有其特点","分析特殊性就是具体问题具体分析","是正确认识事物的基础","是正确解决矛盾的关键","马克思主义的活的灵魂"],"dis":["用一种方法解决一切矛盾","特殊性就是偶然性"],"full":"（1）[[矛盾的普遍性]]是指矛盾存在于一切事物中，存在于一切事物发展过程的始终，旧的矛盾解决了，又产生新的矛盾，事物始终在矛盾中运动。「[[矛盾无处不在，矛盾无时不有]]」就是对矛盾普遍性的形象表述。[[矛盾的特殊性]]是指各个具体事物的矛盾、每一个矛盾的各个方面在发展的不同阶段上[[各有其特点]]。矛盾的特殊性决定了事物的不同性质。\n（2）分析矛盾的特殊性就是坚持[[具体问题具体分析]]。一方面，分析矛盾的特殊性是[[正确认识事物的基础]]，只有这样才能把不同的事物区别开来。另一方面，分析矛盾的特殊性是[[正确解决矛盾的关键]]，不同的矛盾只能用不同的方法解决，即「一把钥匙开一把锁」。因此，具体问题具体分析是[[马克思主义的活的灵魂]]。","src":"参考答案","tip":"两段式：先写两个含义，再写意义。「基础」「关键」「活的灵魂」三个词一个都别漏。"},{"id":"a32","paper":"2025年10月","no":32,"type":"lun","max":10,"stem":"什么是社会意识？如何理解社会意识相对独立性的含义及表现？","points":["社会存在的反映、社会生活的精神方面","受社会存在决定，又有自身发展规律","不完全同步性和不平衡性","内部相互影响且有历史继承性","能动的反作用（突出表现）"],"dis":["社会意识决定社会存在","与社会存在完全同步变化"],"full":"（1）社会意识的含义：社会意识是[[社会存在的反映]]，是[[社会生活的精神方面]]。\n（2）相对独立性的含义：社会意识在从根本上[[受到社会存在决定]]的同时，还具有[[自身特有的发展形式和发展规律]]。\n（3）相对独立性的表现：①社会意识与社会存在发展具有[[不完全同步性和不平衡性]]；②社会意识内部各种形式之间[[存在相互影响且各自具有历史继承性]]；③社会意识对社会存在具有[[能动的反作用]]，这是社会意识相对独立性的[[突出表现]]。","src":"参考答案，教材 P129、P133","tip":"三层：是什么、相对独立性是什么、表现有哪些。「反作用」是突出表现，一定写。"},{"id":"a33","paper":"2025年10月","no":33,"type":"lun","max":10,"stem":"试述资本主义为社会主义所代替的历史必然性。","points":["基本矛盾包含一切冲突的萌芽","资本积累推动矛盾激化","国家垄断资本主义是社会主义的前奏","两大阶级的矛盾和斗争"],"dis":["资本主义可以自我完善","战后新变化改变了资本主义本质"],"full":"[[资本主义的内在矛盾]]决定了资本主义必然被社会主义所代替。（1）资本主义[[基本矛盾]]（生产社会化和生产资料资本主义私人占有之间的矛盾）「[[包含着现代的一切冲突的萌芽]]」。（2）[[资本积累]]推动资本主义基本矛盾不断激化并最终否定资本主义自身。（3）[[国家垄断资本主义]]是资本社会化的更高形式，将成为[[社会主义的前奏]]。（4）资本主义社会存在着[[资产阶级和无产阶级两大阶级]]之间的矛盾和斗争。","src":"参考答案，教材 P278","tip":"开头一句总论，下面四点。第 3 点的「前奏」最容易漏。"},{"id":"c26","paper":"2025年4月","no":26,"type":"sa","max":6,"stem":"什么是马克思主义？","points":["马克思、恩格斯创立并为后继者发展的科学理论体系","关于自然、社会和思维发展一般规律的学说","关于社会主义代替资本主义、实现共产主义的学说","关于无产阶级解放、全人类解放和人的全面发展的学说","无产阶级政党和社会主义国家的指导思想","指引人民创造美好生活的行动指南"],"sc":[1,1,1,1,1,1],"dis":["关于个人成功的方法论","只适用于19世纪欧洲的学说"],"full":"马克思主义是由马克思、恩格斯创立并为后继者所不断发展的[[科学理论体系]]（1分），是关于[[自然、社会和人类思维发展一般规律]]的学说（1分），是关于[[社会主义必然代替资本主义、最终实现共产主义]]的学说（1分），是关于[[无产阶级解放、全人类解放和每个人自由而全面发展]]的学说（1分），是[[无产阶级政党和社会主义国家的指导思想]]（1分），是[[指引人民创造美好生活的行动指南]]（1分）。","src":"官方评分参考","tip":"六句「是……」，每句 1 分。一句一行写下来，写几句得几分。"},{"id":"c27","paper":"2025年4月","no":27,"type":"sa","max":6,"stem":"简述实践是检验真理的唯一标准。","points":["判断真理要看认识与对象是否相符","实践把主观认识与客观实际联系起来对照","实践具有直接现实性的品格","把思想变成现实再与原来的思想对照"],"sc":[2,1,2,1],"dis":["多数人赞成的就是真理","逻辑证明可以取代实践"],"full":"（1）判断认识是不是真理，就是看[[认识与认识对象是否相一致、相符合]]。实践是人的主观见之于客观的活动，它能[[把主观认识与客观实际联系起来加以对照]]，从而使认识得到检验。（3分）\n（2）实践具有[[直接现实性]]的品格。通过实践把思想、理论在现实中实现出来，人们通过[[把变成现实的东西同原来的思想加以对照]]，从而判明该思想是否正确。（3分）","src":"官方评分参考","tip":"两条原因：①实践能把主观和客观连起来对照；②实践有直接现实性。各 3 分。"},{"id":"c28","paper":"2025年4月","no":28,"type":"sa","max":6,"stem":"简述货币的本质和职能。","points":["固定充当一般等价物的商品","价值尺度","流通手段","贮藏手段","支付手段","世界货币"],"sc":[1,1,1,1,1,1],"dis":["信用手段","价格标准"],"full":"（1）货币是[[固定地充当一般等价物的商品]]，体现着商品生产者之间的社会经济关系。（1分）\n（2）货币的五个职能：[[价值尺度]]，衡量一切商品价值大小（1分）；[[流通手段]]，充当商品交换媒介（1分）；[[贮藏手段]]，退出流通被保存起来（1分）；[[支付手段]]，用于清偿债务、支付税款工资等（1分）；[[世界货币]]，在世界市场上发挥一般等价物作用（1分）。","src":"官方评分参考","tip":"本质一句＋五个职能名称，6 句话 6 分，最好拿的一道。"},{"id":"c29","paper":"2025年4月","no":29,"type":"sa","max":6,"stem":"资本主义国家如何利用利率调节经济？","points":["通过利率高低和差别利率实现","支持的产业给优惠信贷，控制的产业从严","经济过热时提高利率","需要刺激时降低利率"],"sc":[2,2,1,1],"dis":["直接下达生产计划","没收私人企业利润"],"full":"（1）利率调节主要是通过[[利率高低和差别利率]]实现的。（2分）\n（2）对需要支持的产业或企业给予[[优惠的信贷条件]]，鼓励其发展；对需要控制的产业或企业用[[较严苛的信贷条件]]来制约。（2分）\n（3）经济过热时[[适当提高利率]]，给经济降温；需要刺激经济时[[适当降低利率]]，刺激投资和消费。（2分）","src":"官方评分参考","tip":"三层：怎么调（高低＋差别）→ 差别利率怎么用 → 高低利率怎么用。"},{"id":"c30","paper":"2025年4月","no":30,"type":"sa","max":6,"stem":"马克思主义政党在社会主义建设和改革中的领导核心作用主要体现在哪些方面？","points":["思想领导","政治领导","组织领导"],"sc":[2,2,2],"dis":["经济领导","文化领导"],"full":"（1）[[思想领导]]：把马克思主义基本原理同本国建设实践相结合，坚持马克思主义在意识形态领域的指导地位。（2分）\n（2）[[政治领导]]：起总揽全局、协调各方的政治领导核心作用，保证社会主义建设的正确方向。（2分）\n（3）[[组织领导]]：通过各种组织形式，把党的路线、方针、政策贯彻到社会实践的各个方面。（2分）","src":"官方评分参考","tip":"思想、政治、组织三个领导，各 2 分。"},{"id":"c31","paper":"2025年4月","no":31,"type":"lun","max":10,"stem":"意识的能动性主要表现在哪些方面？在社会主义现代化建设中如何正确发挥人的主观能动性？","points":["意识活动有目的性和计划性","意识活动有主动性、创造性","意识对人的生理活动有影响","意识能通过指导实践改造世界","尊重客观规律是发挥能动性的前提","把主观能动性和尊重客观规律结合起来"],"sc":[1,1,1,1,3,3],"dis":["只要敢想敢干就能成功","意识可以脱离物质独立存在"],"full":"（1）意识的能动性主要表现在四个方面：意识活动具有[[目的性和计划性]]；意识活动具有[[主动性、创造性]]；意识对于人的[[生理活动]]具有一定影响作用；意识能[[通过指导实践改造客观物质世界]]。（4分）\n（2）[[尊重客观规律是正确发挥主观能动性的前提]]。只有正确认识规律并按规律办事，才能有效改造世界；违背规律，越发挥能动性，挫折和失败越严重。（3分）\n（3）在社会主义现代化建设中，必须[[把发挥主观能动性和尊重客观规律结合起来]]，把高度的实践热情与科学的求实态度结合起来，反对无视客观规律的盲目蛮干。（3分）","src":"官方评分参考","tip":"4 个表现（4 分）＋前提（3 分）＋怎么做（3 分）。"},{"id":"c32","paper":"2025年4月","no":32,"type":"lun","max":10,"stem":"社会改革的实质是什么？社会改革在社会发展中的作用表现在哪些方面？","points":["社会制度的自我完善：对社会体制的改善与革新","巩固新制度或使原有制度获得发展","为新制度诞生做量变和部分质变准备","伴随思想观念和价值取向的变更"],"sc":[4,2,2,2],"dis":["根本改变社会制度","推翻旧的经济基础"],"full":"（1）社会改革是在一定社会制度下，为了解决生产关系不适合生产力、上层建筑不适合经济基础的某些部分或环节，使该社会制度得到持续存在与发展或[[自我完善]]，而对[[社会体制进行的改善与革新]]。（4分）\n（2）作用：第一，[[巩固新生的社会制度]]或使原有社会制度持续存在并获得一定发展（2分）；第二，在社会主义社会以前，社会改革为新社会制度的诞生做[[量变和部分质变的准备]]（2分）；第三，社会体制改革过程中，必然伴随人们[[思想观念和价值取向的变更]]（2分）。","src":"官方评分参考","tip":"实质 4 分最值钱：关键是「体制的改善与革新」，不是根本改变制度（那是革命）。"},{"id":"c33","paper":"2025年4月","no":33,"type":"lun","max":10,"stem":"试述劳动力商品的特点及价值决定。","points":["劳动力也有使用价值和价值","使用价值能创造大于自身价值的价值","价值由生产和再生产劳动力的社会必要劳动时间决定","价值包括三部分生活资料的价值","包含历史和道德因素"],"sc":[1,2,2,3,2],"dis":["劳动力价值等于工人创造的全部价值","劳动力的价值由市场供求决定"],"full":"（1）劳动力作为商品，也具有[[使用价值和价值]]，但作为特殊商品又有不同于普通商品的特点。（1分）\n（2）使用价值的特点：它不仅能创造价值，还能够[[创造出大于自身价值的价值]]，即为购买者创造剩余价值。（2分）\n（3）劳动力的价值由[[生产和再生产劳动力的社会必要劳动时间]]决定，可还原为生产劳动者所消费的生活资料所需的社会必要劳动时间。（2分）\n（4）劳动力价值包括[[三部分生活资料的价值]]：维持劳动者自身生存的、养育家庭的、接受教育和训练的费用。（3分）\n（5）劳动力价值决定还包括[[历史和道德的因素]]。（2分）","src":"官方评分参考","tip":"三部分生活资料（3 分）记牢：自己活、养家、受教育。"},{"id":"d26","paper":"2024年10月","no":26,"type":"sa","max":6,"stem":"简述马克思主义是时代的产物。","points":["19世纪40年代产生","资本主义发展及矛盾尖锐化提供客观条件","工人阶级登上历史舞台准备了阶级基础","时代需要孕育可能性并包含变为现实的条件"],"sc":[1,1,2,2],"dis":["马克思个人天才的产物","自然科学发展的唯一结果"],"full":"（1）马克思主义产生于[[19世纪40年代]]。资本主义的发展及其内在矛盾的尖锐化，为马克思主义的产生提供了[[客观条件]]（2分）；工人阶级作为独立的政治力量登上历史舞台，为马克思主义的产生准备了[[阶级基础]]（2分）。\n（2）马克思主义的产生是[[历史时代提出的一项伟大任务]]。时代的需要既孕育着马克思主义产生的可能性，又包含着使这种可能变为现实的各种物质条件和因素。（2分）","src":"官方评分参考","tip":"客观条件、阶级基础、时代需要，三块各 2 分。"},{"id":"d27","paper":"2024年10月","no":27,"type":"sa","max":6,"stem":"简述认识主体的含义、性质特点和结构。","points":["从事实践和认识活动的现实的、具体的人","有自然物质基础，又有社会性、历史性和能动性","个体、群体和人类整体"],"sc":[2,2,2],"dis":["抽象的、孤立的个人","只包括科学家群体"],"full":"（1）含义：认识主体是指认识和实践活动的承担者，是处于一定社会关系中从事实践活动和认识活动的[[现实的、具体的人]]。（2分）\n（2）性质特点：认识主体不仅具有[[自然的物质基础]]，而且具有[[社会性、历史性和能动性]]。（2分）\n（3）结构：认识主体分为[[个体、群体和人类整体]]诸层次。（2分）","src":"官方评分参考","tip":"含义、特点、结构，一问一答，各 2 分。"},{"id":"d28","paper":"2024年10月","no":28,"type":"sa","max":6,"stem":"什么是商品二因素？简述商品二因素的关系。","points":["商品具有使用价值和价值两个因素","使用价值是有用性，是自然属性","价值是凝结的无差别人类劳动，是社会属性","使用价值是价值的物质承担者"],"sc":[1,2,1,2],"dis":["使用价值越大价值越大","价值是商品的自然属性"],"full":"（1）商品具有[[使用价值和价值]]两个因素。（1分）\n（2）使用价值是物品能够满足人们某种需要的属性，即[[有用性]]，是商品的[[自然属性]]；价值是凝结在商品中的[[无差别的一般人类劳动]]，是商品的[[社会属性]]。（3分）\n（3）[[使用价值是价值的物质承担者]]，价值寓于使用价值之中。（2分）","src":"官方评分参考","tip":"最后一句「使用价值是价值的物质承担者」值 2 分，2025 年 4 月第 14 题选择题也考了。"},{"id":"d29","paper":"2024年10月","no":29,"type":"sa","max":6,"stem":"第二次世界大战后，资本主义国家的资本输出除了量的剧增外，还有哪些新特点？","points":["流向变为多方向，发达国家间相互投资增加","国家资本输出增长并占重要地位","对发展中国家多采取「援助」方式"],"sc":[2,2,2],"dis":["资本输出已经停止","只向殖民地输出"],"full":"（1）[[资本流向]]的变化：从主要由发达国家向落后国家输出，发展到当代的[[多方向输出]]，特别是[[发达国家间相互投资]]大幅增加。（2分）\n（2）在私人资本输出增长的同时，[[国家资本的输出]]也在增长，并日益成为占重要地位的资本输出形式。（2分）\n（3）发达国家向发展中国家的资本输出，多采取所谓[[「援助」的方式]]。（2分）","src":"官方评分参考","tip":"流向、主体、方式，三个新特点。"},{"id":"d30","paper":"2024年10月","no":30,"type":"sa","max":6,"stem":"简述社会主义社会实行按劳分配制度的原因，如何认识其历史作用？","points":["生产力水平不高，存在旧分工和劳动差别","劳动还是谋生手段","打破了「按资分配」，是历史进步","存在历史局限性，但不可避免"],"sc":[2,2,1,1],"dis":["物质财富已经极大丰富","劳动已经成为生活第一需要"],"full":"（1）社会主义阶段，[[生产力水平还不高]]，并存在旧的社会分工，存在体力劳动和脑力劳动等[[劳动差别]]，劳动还仅仅是[[谋生手段]]。因此，个人消费品的分配应当实行按劳分配。（4分）\n（2）按劳分配[[打破了资本主义「按资分配」的原则]]，是一个[[历史的进步]]。这种分配方式尽管存在[[历史局限性]]，但在社会主义阶段是无法避免的。（2分）","src":"官方评分参考","tip":"原因 4 分是重点：生产力不高、有劳动差别、劳动是谋生手段。"},{"id":"d31","paper":"2024年10月","no":31,"type":"lun","max":10,"stem":"试述否定之否定规律的基本内容。这一规律所揭示的事物发展是前进性和曲折性统一的原理，对于我们正确认识社会主义现代化建设事业有何重要意义？","points":["经两次辩证否定：肯定—否定—否定之否定","表现为螺旋式上升、波浪式前进","总趋势前进上升，道路曲折","坚信社会主义前途光明","准备走曲折的路"],"sc":[2,1,1,3,3],"dis":["事物发展是直线上升的","事物发展是循环往复的"],"full":"（1）基本内容：事物的发展经过[[两次辩证的否定]]，由[[肯定阶段到否定阶段，再到否定之否定阶段]]，从而使事物的发展表现为[[螺旋式上升和波浪式前进]]的过程。（4分）\n（2）否定之否定规律揭示了事物发展的[[总趋势是前进的、上升的]]，[[具体道路是曲折的]]，是前进性和曲折性的统一。意义：首先，要[[坚信社会主义的前途是光明的]]，不因暂时的挫折而动摇（3分）；其次，要[[准备走曲折的路]]，充分认识建设事业的艰巨性和复杂性（3分）。","src":"官方评分参考","tip":"意义两句话 6 分：前途光明（前进性）＋准备走曲折的路（曲折性），正好对应。"},{"id":"d32","paper":"2024年10月","no":32,"type":"lun","max":10,"stem":"试述社会形态发展的统一性和多样性的含义及表现。","points":["统一性：同一社会形态的共同性、普遍性","多样性：不同国家民族各有特点","同一社会形态中各有特点","不同国家在各社会形态中的典型意义不同","过渡形式各有特点","可能超越某一个或几个社会形态"],"sc":[4,2,1,1,1,1],"dis":["所有国家都必须依次经历五种社会形态","各国历史毫无共同之处"],"full":"（1）统一性：处于同一社会形态的不同国家和民族的历史发展具有的[[共同性、普遍性]]，即具有大致相同的生产力水平、生产关系体系和上层建筑。（4分）\n（2）多样性：不同国家和民族的历史发展具有[[不同的特点]]。（2分）主要表现：第一，同一社会形态的不同国家和民族的历史[[各有特点]]；第二，各个国家在不同社会形态中的[[典型意义不同]]；第三，向较高社会形态转变时，[[过渡形式各有特点]]；第四，有些国家由于特殊条件，可能[[超越某一个或某几个社会形态]]。（4分）","src":"官方评分参考","tip":"统一性一句 4 分最值钱；多样性定义＋四个表现。"},{"id":"d33","paper":"2024年10月","no":33,"type":"lun","max":10,"stem":"试析影响资本周转速度的因素，以及资本周转对剩余价值生产的影响。","points":["因素：周转时间和生产资本构成","周转时间＝生产时间＋流通时间","固定与流动资本的比例及各自周转速度","加速周转可增加年剩余价值量、提高年剩余价值率"],"sc":[2,2,3,3],"dis":["周转越慢剩余价值越多","只取决于工人人数"],"full":"（1）影响资本周转的因素，主要有[[周转时间和生产资本构成]]两方面。（2分）\n（2）资本周转时间包括[[生产时间和流通时间]]。生产时间越短，流通越快，资本获得的剩余价值就越多。（2分）\n（3）生产资本构成是依据价值周转方式，将生产资本分为[[固定资本和流动资本]]。其对周转的影响：一是两者的[[比例]]，二是两者各自的[[周转速度]]。（3分）\n（4）加速资本周转，可[[增加年剩余价值量，提高年剩余价值率]]。（3分）","src":"官方评分参考","tip":"因素两方面展开，最后一句结论 3 分。"},{"id":"e26","paper":"2024年4月","no":26,"type":"sa","max":6,"stem":"为什么说一个正确的认识需要经过多次反复才能完成？","points":["从客体看：事物复杂，本质逐渐暴露","受特定社会历史条件限制","从主体看：受生理、知识、经验、能力、立场等限制","须经实践到认识、认识到实践的多次反复"],"sc":[2,1,2,1],"dis":["一次实践就能获得全部真理","认识与实践无关"],"full":"（1）从[[认识客体]]方面看，客观事物本身是[[复杂]]的，事物的本质要经历一个过程才逐渐暴露出来，而且受特定[[社会历史条件]]的限制，认识必须经历反复的过程。（3分）\n（2）从[[认识主体]]方面看，受[[生理因素、知识水平、生活经验、认识能力及立场、观点、方法]]的限制，必须经过由实践到认识、再由认识到实践的[[多次反复]]，才能获得正确认识。（3分）","src":"官方评分参考","tip":"客体一层、主体一层，各 3 分。"},{"id":"e27","paper":"2024年4月","no":27,"type":"sa","max":6,"stem":"简述生产方式及其在社会发展中的作用。","points":["谋取生活资料的方式，是生产力和生产关系的统一","人类区别于动物的根本标志","人类和人类社会存在和发展的基础","形成一切社会关系的基础","决定社会制度的性质和更替"],"sc":[2,1,1,1,1],"dis":["地理环境决定社会制度","人口数量决定社会性质"],"full":"（1）生产方式是人类借以向自然界谋取必需的生活资料的方式，是[[生产力和生产关系的统一]]。（2分）\n（2）生产方式在社会发展中起[[决定作用]]：第一，是人类从动物界分离出来的根本动力和人类[[区别于动物的根本标志]]；第二，是人类和人类社会得以[[存在和发展的基础]]；第三，生产活动是形成[[人类一切社会关系的基础]]；第四，生产方式[[决定社会制度的性质和更替]]。（4分）","src":"官方评分参考","tip":"一个定义＋四个「第一第二第三第四」。"},{"id":"e28","paper":"2024年4月","no":28,"type":"sa","max":6,"stem":"劳动二重性理论是「理解政治经济学的枢纽」，请简要说明劳动二重性的含义。","points":["生产商品的劳动既是具体劳动也是抽象劳动","具体劳动：有特定性质、目的和形式","抽象劳动：撇开具体形式的无差别一般人类劳动","具体劳动创造使用价值，抽象劳动创造价值"],"sc":[2,1,1,2],"dis":["私人劳动和社会劳动","简单劳动和复杂劳动"],"full":"（1）劳动二重性是指生产商品的劳动既是[[具体劳动]]，也是[[抽象劳动]]。（2分）\n（2）具体劳动是生产一定使用价值的具有[[特定性质、目的和形式]]的劳动；抽象劳动是[[撇开一切具体形式的、无差别的一般人类劳动]]。（2分）\n（3）具体劳动创造商品的[[使用价值]]，是自然属性；抽象劳动创造商品的[[价值]]，是社会属性。（2分）","src":"官方评分参考","tip":"是什么→分别是什么→分别创造什么。"},{"id":"e29","paper":"2024年4月","no":29,"type":"sa","max":6,"stem":"简述资本主义国家宏观经济管理与调节的主要目标。","points":["运用财政、货币政策调节总供给和总需求","保持经济稳定和增长","实现充分就业","保持币值和物价稳定","国际国内收支大体平衡"],"sc":[2,1,1,1,1],"dis":["消灭经济危机","实现生产资料公有"],"full":"（1）资本主义国家宏观经济管理与调节主要是运用[[财政政策、货币政策]]等经济手段，对[[社会总供给和总需求]]进行调节。（2分）\n（2）主要目标：[[保持经济稳定和增长]]、[[实现充分就业]]、[[保持币值和物价稳定]]、[[国际国内收支大体平衡]]。（4分）","src":"官方评分参考","tip":"四个目标：增长、就业、物价、收支。"},{"id":"e30","paper":"2024年4月","no":30,"type":"sa","max":6,"stem":"共产主义精神境界的极大提高表现在哪些方面？","points":["高度自觉的劳动态度，遵守社会公共生活准则","摆脱封建保守观念和资产阶级利己主义","树立以集体主义为核心的人生观、价值观、道德观"],"sc":[3,1,2],"dis":["个人利益至上","不再需要任何社会规范"],"full":"（1）人们树立了[[高度自觉的劳动态度]]，遵守社会纪律，团结互助，诚实友爱，完全从社会公共利益出发，人人都习惯于[[遵守社会公共生活的基本准则]]。（3分）\n（2）人们既摆脱了[[封建的、保守的思想观念]]的束缚，又摒弃了以[[利己主义为核心的资产阶级思想]]，树立了以[[集体主义为核心]]的共产主义人生观、价值观和道德观。（3分）","src":"官方评分参考","tip":"两段：行为上（劳动态度、守规矩）＋思想上（集体主义）。"},{"id":"e31","paper":"2024年4月","no":31,"type":"lun","max":10,"stem":"试述量变和质变的辩证关系原理及其对于社会主义建设的意义。","points":["量变是质变的必要准备","质变是量变的必然结果","量变和质变相互渗透","远大理想与踏实苦干、稳步前进结合","反对急躁冒进、急于求成"],"sc":[2,2,2,2,2],"dis":["量变和质变毫无关系","只要质变不要量变"],"full":"（1）[[量变是质变的必要准备]]，没有一定的量变就不会发生质变，量变规定质变的性质和方向（2分）。[[质变是量变的必然结果]]，量变达到一定程度必然引起质变（2分）。量变和质变[[相互渗透]]，质变体现和巩固量变的成果，总的量变过程中有部分质变（2分）。\n（2）在社会主义建设和改革中，要把[[远大理想、奋斗目标同踏实苦干、稳步前进结合起来]]。如果[[急躁冒进、急于求成]]，结果只能是欲速则不达。（4分）","src":"官方评分参考","tip":"原理三句话（准备、结果、渗透）各 2 分，意义一段 4 分。"},{"id":"e32","paper":"2024年4月","no":32,"type":"lun","max":10,"stem":"相对剩余价值和超额剩余价值是怎样生产出来的？","points":["相对：工作日既定，缩短必要劳动时间、延长剩余劳动时间","以社会劳动生产率提高为条件","超额：个别企业提高劳动生产率，个别价值低于社会价值","按社会价值出售而获得"],"sc":[3,3,2,2],"dis":["靠延长工作日获得","靠提高商品售价获得"],"full":"（1）相对剩余价值生产是在[[工作日既定]]的条件下，通过[[减少必要劳动时间]]，相应[[延长剩余劳动时间]]来生产剩余价值的方法。（3分）\n（2）相对剩余价值的生产以[[社会劳动生产率的提高]]、从而必要劳动时间的缩短为条件。（3分）\n（3）超额剩余价值是[[个别企业]]通过提高劳动生产率，使其[[个别劳动时间低于社会必要劳动时间]]，商品的个别价值低于社会价值，商品在市场上[[按社会价值出售]]，资本家因此所获得的剩余价值。（4分）","src":"官方评分参考","tip":"关键分界：相对靠「社会」劳动生产率，超额靠「个别」企业。"},{"id":"e33","paper":"2024年4月","no":33,"type":"lun","max":10,"stem":"第二次世界大战后国家垄断资本主义大发展的原因是什么？","points":["私人垄断资本无法满足巨额资金需要","大规模公共设施私人资本无力或不愿投资","大型基础性科研私人资本不愿涉足","生产过剩私人资本难以解决","社会化大生产要求国家宏观调控","国家再分配功能越来越重要"],"sc":[2,2,2,2,1,1],"dis":["社会主义国家的支持","资本主义私有制已经消失"],"full":"二战后国家垄断代替私人垄断成为当代资本主义发展的新形式，原因：（1）仅靠私人垄断资本，无法满足大规模经济建设所需的[[巨额资金]]（2分）；（2）大规模[[公共设施]]建设，私人垄断资本无力或不愿投资（2分）；（3）大型、基础性、前导性的[[科学研究]]项目，私人垄断资本不愿涉足（2分）；（4）日益严重的[[生产过剩]]问题仅靠私人垄断资本难以解决（2分）；（5）社会化大生产要求国家出面进行[[宏观调控]]（1分）；（6）经济利益调整方面，国家的[[再分配]]功能越来越重要（1分）。","src":"官方评分参考","tip":"六点，前四点 2 分：钱不够、设施不愿投、科研不愿碰、过剩解决不了。"}],"papers":[{"id":"p2604","name":"2026 年 4 月卷","code":"15044","mc":[["下列选项属于马克思主义基本组成部分的是",["马克思主义立场、观点和方法","马克思主义自然观、历史观和价值观","马克思主义物质观、实践观和发展观","马克思主义哲学、政治经济学和科学社会主义"],3,"三个基本组成部分：哲学、政治经济学、科学社会主义。其余三项是拼出来的相似组合，不是「组成部分」。"],["作为马克思主义公开问世标志的是",["“正义者同盟”改组","《共产党宣言》发表","欧洲革命爆发","《新莱茵报》创刊"],1,"1848 年《共产党宣言》发表，标志着马克思主义公开问世。"],["下列表述属于列宁的物质定义内容的是",["物质是标志客观实在的哲学范畴","物质与时间具有统一性","物质是与运动不可分割的","物质与空间具有统一性"],0,"定义的核心是「客观实在」。B、C、D 讲的是物质与运动、时空的关系，话没错，但不是定义。"],["下列选项正确揭示意识的本质的是",["意识是人脑的产物","意识是在劳动交往中发展的","意识是物质的产物","意识是客观世界的主观映象"],3,"本质＝客观世界的主观映象。A、C 只讲了意识从哪来，没讲意识是什么。"],["世界的统一性问题，是回答世界上的万事万物",["有没有共同特征的问题","有没有相同结构的问题","有没有共同本质的问题","有没有相同功能的问题"],2,"统一性问题问的是万事万物有没有共同本质。唯物主义的回答：世界统一于物质。"],["任何事物内部的各要素之间、任何事物和其他事物之间都是有联系的，整个世界是相互联系的统一整体。这表明",["联系具有客观性","联系具有普遍性","联系具有多样性","联系具有条件性"],1,"「任何……都有联系」「整个世界是统一整体」＝到处都有＝普遍性。"],["在认识的本质问题上，旧唯物主义认识论的缺陷有二，一个是离开辩证法考察认识问题，另一个是",["离开实践考察认识问题","没有坚持反映论的立场","离开主体考察认识问题","没有坚持先验论的立场"],0,"旧唯物主义两大缺陷：离开实践、离开辩证法，所以只能是消极的直观反映。它坚持了反映论，B 不对。"],["理性认识由低级向高级的发展表现为",["从感觉到知觉再到表象","从观察到联想再到猜测","从概念到判断再到推理","从分析到归纳再到假说"],2,"理性三形式：概念→判断→推理。A 是感性认识的三形式，专门放在这里等你混。"],["下列关于真理的说法中，正确的是",["真理是独立于主体意识的物质实体","真理是思维与它的先验形式相一致","真理是不以人的意志为转移的客观规律","真理是对客观事物及其规律的正确反映"],3,"真理是一种认识，是对规律的正确反映。C 把真理说成规律本身，混淆了认识和认识的对象。"],["对人类社会发展起决定作用的是",["富饶的自然资源","良好的生态环境","适度的人口数量","物质资料的生产方式"],3,"起决定作用的是物质资料的生产方式。自然环境、人口只能影响和制约。"],["在整个上层建筑中，居于主导地位的是",["政治法律思想","政治上层建筑","艺术和宗教","道德和哲学"],1,"政治上层建筑居主导地位，核心是国家政权。A、C、D 属于观念上层建筑。"],["承认社会形态更替的必然性的同时又承认主体选择的作用，这种观点属于",["历史唯心主义","机械决定论","历史唯物主义","诡辩论"],2,"必然性和主体选择都承认，是历史唯物主义。只认必然、否认选择的，是机械决定论。"],["关于个人在历史进程中的作用，唯物史观认为",["每个个体都是历史活动的参与者","历史人物的作用总是促进性的","个人在历史上的作用不存在差别","历史人物的作用不受规律制约"],0,"B、C、D 都带绝对化字眼（总是、不存在、不受），一眼可排除。"],["商品经济得以产生的社会历史条件，除了生产资料和劳动产品属于不同所有者之外，还有一个，即",["存在自然分工","存在社会分工","存在部落内部分工","存在部落间分工"],1,"两个条件：社会分工＋不同所有者。是「社会分工」，不是自然分工。"],["商品二因素中反映人与自然之间的物质关系、属于商品自然属性的因素，是商品的",["使用价值","交换价值","价值","价格"],0,"使用价值＝自然属性＝人与自然；价值＝社会属性＝人与人。"],["以私有制为基础的商品经济的基本矛盾是",["具体劳动和抽象劳动的矛盾","私人劳动和社会劳动的矛盾","个别劳动和一般劳动的矛盾","生产劳动和非生产劳动的矛盾"],1,"基本矛盾＝私人劳动和社会劳动。A 是劳动二重性，被放进来陪跑。"],["资本主义生产方式的绝对规律是",["资本主义的竞争规律","资本积累的一般规律","资本主义再生产周期规律","剩余价值规律"],3,"生产剩余价值是资本主义生产的目的和决定性动机，所以剩余价值规律是它的绝对规律。"],["从资本循环角度看，资本家工厂中已经进入仓库的产成品，属于产业资本循环中的",["货币资本形态","生产资本形态","商品资本形态","固定资本形态"],2,"三形态：货币资本→生产资本→商品资本。做好待卖的东西就是商品资本。D 是另一套分法里的词。"],["19世纪末20世纪初形成的垄断资本主义主要以私人垄断资本为基础。私人垄断资本主义形成的基础是",["生产集中和市场集中","生产集中和资本集中","资本集中和市场集中","技术集中和资本集中"],1,"固定搭配：生产集中和资本集中。"],["垄断是通过一定的垄断组织形式实现的。在一个或几个经济部门中占据垄断地位的大企业联合形成的垄断组织，形式多种多样且不断变化，其中最简单、初级的垄断组织形式是",["短期价格协定","长期价格协定","短期市场协定","长期市场协定"],0,"从松到紧：短期价格协定→卡特尔→辛迪加→托拉斯→康采恩→混合联合公司。最简单的是短期价格协定。"],["资本主义国家运用财政政策、货币政策等经济手段，对社会总供给和总需求进行调节，这种调节形式属于",["法律调节","政治调节","宏观调节","微观调节"],2,"财政政策、货币政策调节总供给和总需求，属于宏观调节。"],["垄断资本形成后会向世界范围扩展。从输出资本的主体来看，主要有",["借贷资本输出和商品资本输出","生产资本输出和商品资本输出","私人资本输出和国家资本输出","生产资本输出和借贷资本输出"],2,"按主体分：私人和国家；按形式分：借贷资本输出和生产资本输出。D 是按形式分的，题干问的是主体。"],["恩格斯在《在马克思墓前的讲话》中指出，马克思一生有两大发现。正是这两大发现为实现社会主义从空想到科学的飞跃奠定了坚实的理论基础。这两大发现是",["辩证唯物主义和历史唯物主义","唯物史观和剩余价值学说","劳动价值论和剩余价值学说","唯物论和辩证法"],1,"两大发现：唯物史观和剩余价值学说。"],["在展望未来社会的问题上，马克思主义与空想社会主义的根本区别是",["是否坚持科学的立场观点方法","是否对未来社会做详尽描述","是否反映无产阶级的愿望要求","是否批判了资本主义旧世界"],0,"根本区别在立场观点方法。B 也是二者的不同之处，但只是表现，不是根本。"],["共产党人的最高理想是",["建设社会主义","实现新民主主义","建设中国特色社会主义","实现共产主义"],3,"最高理想＝实现共产主义；现阶段的共同理想＝建设中国特色社会主义。"]],"sa":["b26","b27","b28","b29","b30"],"lun":["b31","b32","b33"]},{"id":"p2510","name":"2025 年 10 月卷","code":"15044","mc":[["在马克思主义理论体系中，马克思主义哲学、马克思主义政治经济学和科学社会主义共同构成其",["基本内涵","主要特征","根本性质","主体内容"],3,"马克思主义理论体系的主体内容由马克思主义哲学、马克思主义政治经济学和科学社会主义三部分构成。三者相互联系、有机统一，共同支撑起马克思主义的理论框架。（教材 P2）"],["下列选项属于为马克思主义的创立提供了直接理论来源的是",["古希腊罗马哲学","文艺复兴运动的思想成果","德国古典哲学","法国复辟时期历史学家的进步思想"],2,"马克思主义的直接理论来源包括德国古典哲学、英国古典政治经济学和英法两国的空想社会主义。德国古典哲学（以黑格尔辩证法和费尔巴哈唯物主义为代表）为马克思主义哲学的创立提供了重要理论借鉴。（教材 P5）"],["唯物主义和唯心主义是两种根本对立的哲学派别，其形成的原因在于",["二者对客观实在性的认识不同","二者对主观能动性的认识不同","二者对物质和意识谁为本源问题的回答不同","二者对思维和存在有否同一性问题的回答不同"],2,"唯物主义和唯心主义的根本分歧在于对物质和意识谁是世界本源问题的不同回答。唯物主义认为物质是本原，唯心主义认为意识是本原。（教材 P26）"],["客观实在性作为物质的唯一特性，体现的是",["某种自然存在的个别特性","自然存在和社会存在的不同特性","几种自然存在的共同特性","自然存在和社会存在的共同特性"],3,"物质的唯一特性是客观实在性，这一特性既适用于自然领域的存在（如山川河流），也适用于社会领域的存在（如生产方式、社会关系），是二者的共同特性。（教材 P28-P29）"],["马克思指出：“观念的东西不外是移入人脑并在人的头脑中改造过的物质的东西而已。”这就是说",["意识是人脑的分泌物","意识是客观世界的主观映象","意识是人脑的附属物","意识是客观世界的虚幻影像"],1,"马克思的这句话表明，意识的内容来源于客观物质世界，是人脑对客观事物的主观反映。意识并非人脑凭空产生，而是对物质的能动改造后的结果，既不是人脑的分泌物（庸俗唯物主义观点），也不是虚幻影像。（教材 P33）"],["在唯物辩证法体系中，反映事物的过去、现在和将来关系的一对范畴是",["内容和形式","本质和现象","原因和结果","现实和可能"],3,"现实范畴反映事物当下的实际存在状态，可能范畴反映事物未来发展的潜在趋势，二者揭示了事物过去、现在与将来的联系。内容与形式反映事物的构成与表现方式，本质与现象反映事物的内在联系与外在表现，原因与结果反映事物的前后相继、引起与被引起关系。（教材 P54）"],["“认识的本质是主体在实践基础上对客体的能动反映”，这是一种",["主观唯心主义认识论观点","客观唯心主义认识论观点","辩证唯物主义认识论观点","旧唯物主义认识论观点"],2,"辩证唯物主义认识论认为，认识的本质是主体在实践基础上对客体的能动反映，既强调实践的决定性作用，又承认认识的能动性。主观唯心主义认识论否认客观客体的存在，客观唯心主义认识论将认识归结为对绝对精神的把握，旧唯物主义认识论否认认识的能动性。（教材 P81-P82）"],["轻视理性认识而片面夸大感性认识的作用，会导致实践中的",["实用主义","怀疑主义","教条主义","经验主义"],3,"经验主义片面夸大感性认识的作用，轻视理性认识的指导意义，认为只有感性经验才是可靠的认识来源。实用主义强调认识的实际效用，怀疑主义否认认识的可能性，教条主义片面夸大理性认识的作用，轻视感性经验。（教材 P87）"],["实践是检验真理的唯一标准，这是因为",["实践是人类生存和发展的基础","实践是人类社会生活的本质","实践是真理和价值统一的基础","实践具有直接现实性的品质"],3,"实践之所以是检验真理的唯一标准，核心在于实践具有直接现实性——它能将主观认识转化为客观现实，通过实际结果验证认识是否符合客观规律。其他选项虽表述正确，但并非这一命题的根本原因。（教材 P101）"],["中国共产党的思想路线的核心是",["自信自立","守正创新","实事求是","自我革命"],2,"中国共产党的思想路线是一切从实际出发，理论联系实际，实事求是，在实践中检验真理和发展真理。其中，实事求是是思想路线的核心。（教材 P117）"],["社会历史观的基本问题是",["社会存在和社会意识的关系问题","物质文明和精神文明协调发展的问题","社会革命和社会改革的关系问题","群众、阶级、政党、领袖的关系问题"],0,"社会存在与社会意识的关系问题，是社会历史观的基本问题。正确认识社会存在与社会意识的关系，是科学把握人类社会发展规律的基础和前提。（教材 P126）"],["社会存在即社会物质生活条件，是社会生活的物质方面。下列选项中不属于社会存在的是",["自然地理环境","政治法律思想","物质生产方式","人口因素"],1,"社会存在包括自然地理环境、人口因素和物质生产方式（生产力与生产关系的统一）。政治法律思想属于社会意识的范畴，是上层建筑的重要组成部分。（教材 P127）"],["下列各项正确说明经济基础与上层建筑的关系的是",["经济基础的性质决定上层建筑的性质","上层建筑的性质决定经济基础的性质","上层建筑的变化决定经济基础的变化","上层建筑各个部分都随经济基础的变化而同步变化"],0,"经济基础与上层建筑的关系中，经济基础处于决定地位：经济基础的性质决定上层建筑的性质，经济基础的变化发展决定上层建筑的变化发展。上层建筑具有相对独立性，并非与经济基础同步变化，也不能决定经济基础。（教材 P142）"],["从商品二因素与劳动二重性的关系考察商品经济中能够形成商品价值的劳动是",["具体劳动","体力劳动","抽象劳动","脑力劳动"],2,"商品二因素（使用价值和价值）对应劳动二重性（具体劳动和抽象劳动）。具体劳动创造商品的使用价值，抽象劳动（无差别的人类一般劳动）形成商品的价值。（教材 P189）"],["下列关于商品价值量决定关系的表述中，正确的是",["商品的价值量与社会必要劳动时间成正比，与劳动生产率成反比","商品的价值量与社会必要劳动时间成反比，与劳动生产率成正比","商品的价值量与社会必要劳动时间成正比，与劳动生产率也成正比","商品的价值量与社会必要劳动时间成反比，与劳动生产率也成反比"],0,"商品的价值量由社会必要劳动时间决定，二者成正比——社会必要劳动时间越长，价值量越大。劳动生产率（单位时间内生产的商品数量）与价值量成反比——劳动生产率越高，单位商品耗费的社会必要劳动时间越少，价值量越小。（教材 P190）"],["资本主义社会中，劳动力成为商品要具备的基础条件，不包括",["劳动者在法律上是自由人","劳动者人身依附于资本家","劳动者没有生活资料来源","劳动者没有任何生产资料"],1,"劳动力成为商品的两个基本条件：一是劳动者在法律上是自由人，能自主支配自己的劳动力；二是劳动者没有任何生产资料和生活资料，只能靠出卖劳动力为生。劳动者人身依附于资本家是封建制生产关系的特征，并非劳动力成为商品的条件。（教材 P208）"],["资本主义社会经济危机会周期性爆发，但现实中资本主义的再生产周期不一定都要依次经过典型的四个阶段，其中有一个阶段是资本主义经济周期的必经阶段和基本阶段，这个阶段是",["危机阶段","萧条阶段","复苏阶段","高涨阶段"],0,"资本主义再生产周期包括危机、萧条、复苏、高涨四个阶段，其中危机阶段是必经阶段和基本阶段，是资本主义基本矛盾激化的集中表现，决定了周期的性质和进程。（教材 P228）"],["资本主义国家政权采取分权制衡的组织形式，即三权分立制度，下列选项中不属于这“三权”的是",["监督权","司法权","行政权","立法权"],0,"三权分立制度中的“三权”指立法权、行政权和司法权，三者相互独立、相互制衡。监督权并非独立的“三权”之一，而是通过三权之间的制约关系实现的。（教材 P231）"],["垄断资本主义形成于19世纪末20世纪初，由于这一时期的垄断资本主义主要以私人垄断资本为基础，因此又被称为",["私人垄断资本主义","垄断竞争资本主义","国家垄断资本主义","金融垄断资本主义"],0,"19世纪末20世纪初形成的垄断资本主义，以私人垄断资本为基础，称为私人垄断资本主义。国家垄断资本主义是二战后发展起来的，指国家政权与私人垄断资本相结合的垄断资本主义。（教材 P241）"],["垄断资本主义国家的垄断组织虽然形式多种多样，但本质都是为了",["促进技术进步","获得垄断利润","控制销售市场","增加商品生产"],1,"垄断组织的形式（如卡特尔、辛迪加、托拉斯等）虽各不相同，但本质都是为了获取垄断利润——通过垄断价格（高于或低于生产价格的价格）实现的超额利润，是垄断资本主义的核心目标。（教材 P245）"],["第二次世界大战后，资本主义生产资料所有制发生了新的变化，成为居主导地位的所有制形式是",["国家资本所有制","法人资本所有制","员工持股所有制","知识资本所有制"],1,"二战后，资本主义生产资料所有制发生新变化，法人资本所有制逐渐取代私人资本所有制，成为居主导地位的所有制形式。法人资本所有制是指法人股东（如企业法人、金融机构法人）控股的所有制形式。（教材 P262-P263）"],["与通常意义上对金融资本概念的理解和使用不同，马克思主义政治经济学的金融资本概念有其独特内涵，它指的是垄断资本主义国家",["银行自有资本和借入资本的总和","银行和非银行金融机构资本的总和","资本市场上流通的所有货币资本的总和","工业垄断资本和银行垄断资本融合形成的垄断资本"],3,"马克思主义政治经济学中的金融资本，特指工业垄断资本和银行垄断资本在竞争中相互融合形成的新型垄断资本，并非泛指所有金融机构的资本或货币资本总和。（教材 P244）"],["无产阶级夺取政权的第一次伟大尝试是",["第一国际成立","巴黎公社革命","第二国际成立","十月革命"],1,"1871年的巴黎公社革命，是无产阶级第一次尝试建立自己的国家政权，为无产阶级革命积累了宝贵经验。十月革命是人类历史上第一次胜利的社会主义革命，建立了第一个社会主义国家。（教材 P286）"],["社会主义国家的最高政治领导力量是",["工会","社会党","共产党","共青团"],2,"社会主义国家的最高政治领导力量是共产党，这是由社会主义国家的性质和共产党的先进性决定的，是社会主义事业顺利发展的根本保证。（教材 P304）"],["共产主义社会的根本特征是",["人与自然和谐共生","人们的精神境界极大提高","社会关系高度和谐","实现人的自由而全面的发展"],3,"共产主义社会的根本特征是实现人的自由而全面的发展。人与自然和谐共生、精神境界极大提高、社会关系高度和谐都是共产主义社会的重要特征，但并非根本特征。（教材 P339）"]],"sa":["a26","a27","a28","a29","a30"],"lun":["a31","a32","a33"]},{"id":"p2504","name":"2025 年 4 月卷","code":"15044","mc":[["马克思主义是时代的产物。资本主义的发展及其内在矛盾的尖锐化，为马克思主义的产生提供了",["阶级基础","客观条件","科学前提","思想渊源"],1,"资本主义的发展＝客观条件；工人阶级登上舞台＝阶级基础。2024 年 10 月简答 26 题的原话。"],["马克思主义的基本特征用一句话来概括就是",["科学性与革命性的统一","科学性与人民性的统一","科学性与实践性的统一","科学性与发展性的统一"],0,"一句话概括：科学性与革命性的统一。"],["思维和存在的关系问题作为哲学的基本问题也称为",["主体和客体的关系问题","理论和实践的关系问题","意识和物质的关系问题","社会和自然的关系问题"],2,"思维＝意识，存在＝物质。"],["运动是物质的根本属性。否认物质的运动和运动的绝对性，必然导致",["相对主义","不可知论","唯心主义","形而上学"],3,"否认运动＝形而上学；设想无物质的运动＝唯心主义。"],["唯物辩证法认为，事物之间的相互联系是事物本身固有的，是不以人的主观意志为转移的。这说明联系具有",["稳定性","普遍性","客观性","多样性"],2,"「固有」「不以人的意志为转移」＝客观性。"],["在唯物辩证法体系中，作为其实质与核心的是",["对立统一规律","量变质变规律","否定之否定规律","因果规律"],0,"实质和核心＝对立统一规律。"],["“从物到感觉和思想”与“从感觉和思想到物”的对立，是",["唯物辩证法和形而上学的对立","直观反映论和能动反映论的对立","唯物主义一元论和唯心主义一元论的对立","唯物主 联合形成的垄断组织，形式多种多样且不断变化，其中最简单、初级的垄断组织形式是","o":["短期价格协定","长期价格协定","短期市场协定","长期市场协定"],"a":0,"w":"从松到紧：短期价格协定→卡特尔→辛迪加→托拉斯→康采恩→混合联合公司。最简单的是短期价格协定。","s":"2026 年 4 月第 20 题","y":"2026 年 4 月"},{"k":"p2604-20","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"资本主义国家运用财政政策、货币政策等经济手段，对社会总供给和总需求进行调节，这种调节形式属于","o":["法律调节","政治调节","宏观调节","微观调节"],"a":2,"w":"财政政策、货币政策调节总供给和总需求，属于宏观调节。","s":"2026 年 4 月第 21 题","y":"2026 年 4 月"},{"k":"p2604-21","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"垄断资本形成后会向世界范围扩展。从输出资本的主体来看，主要有","o":["借贷资本输出和商品资本输出","生产资本输出和商品资本输出","私人资本输出和国家资本输出","生产资本输出和借贷资本输出"],"a":2,"w":"按主体分：私人和国家；按形式分：借贷资本输出和生产资本输出。D 是按形式分的，题干问的是主体。","s":"2026 年 4 月第 22 题","y":"2026 年 4 月"},{"k":"p2604-22","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"恩格斯在《在马克思墓前的讲话》中指出，马克思一生有两大发现。正是这两大发现为实现社会主义从空想到科学的飞跃奠定了坚实的理论基础。这两大发现是","o":["辩证唯物主义和历史唯物主义","唯物史观和剩余价值学说","劳动价值论和剩余价值学说","唯物论和辩证法"],"a":1,"w":"两大发现：唯物史观和剩余价值学说。","s":"2026 年 4 月第 23 题","y":"2026 年 4 月"},{"k":"p2604-23","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"在展望未来社会的问题上，马克思主义与空想社会主义的根本区别是","o":["是否坚持科学的立场观点方法","是否对未来社会做详尽描述","是否反映无产阶级的愿望要求","是否批判了资本主义旧世界"],"a":0,"w":"根本区别在立场观点方法。B 也是二者的不同之处，但只是表现，不是根本。","s":"2026 年 4 月第 24 题","y":"2026 年 4 月"},{"k":"p2604-24","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"共产党人的最高理想是","o":["建设社会主义","实现新民主主义","建设中国特色社会主义","实现共产主义"],"a":3,"w":"最高理想＝实现共产主义；现阶段的共同理想＝建设中国特色社会主义。","s":"2026 年 4 月第 25 题","y":"2026 年 4 月"},{"k":"p2510-0","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"在马克思主义理论体系中，马克思主义哲学、马克思主义政治经济学和科学社会主义共同构成其","o":["基本内涵","主要特征","根本性质","主体内容"],"a":3,"w":"马克思主义理论体系的主体内容由马克思主义哲学、马克思主义政治经济学和科学社会主义三部分构成。三者相互联系、有机统一，共同支撑起马克思主义的理论框架。（教材 P2）","s":"2025 年 10 月第 1 题","y":"2025 年 10 月"},{"k":"p2510-1","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"下列选项属于为马克思主义的创立提供了直接理论来源的是","o":["古希腊罗马哲学","文艺复兴运动的思想成果","德国古典哲学","法国复辟时期历史学家的进步思想"],"a":2,"w":"马克思主义的直接理论来源包括德国古典哲学、英国古典政治经济学和英法两国的空想社会主义。德国古典哲学（以黑格尔辩证法和费尔巴哈唯物主义为代表）为马克思主义哲学的创立提供了重要理论借鉴。（教材 P5）","s":"2025 年 10 月第 2 题","y":"2025 年 10 月"},{"k":"p2510-2","day":"d3","topic":"认识论与真理","cls":"zhe","q":"唯物主义和唯心主义是两种根本对立的哲学派别，其形成的原因在于","o":["二者对客观实在性的认识不同","二者对主观能动性的认识不同","二者对物质和意识谁为本源问题的回答不同","二者对思维和存在有否同一性问题的回答不同"],"a":2,"w":"唯物主义和唯心主义的根本分歧在于对物质和意识谁是世界本源问题的不同回答。唯物主义认为物质是本原，唯心主义认为意识是本原。（教材 P26）","s":"2025 年 10 月第 3 题","y":"2025 年 10 月"},{"k":"p2510-3","day":"d4","topic":"唯物史观","cls":"zhe","q":"客观实在性作为物质的唯一特性，体现的是","o":["某种自然存在的个别特性","自然存在和社会存在的不同特性","几种自然存在的共同特性","自然存在和社会存在的共同特性"],"a":3,"w":"物质的唯一特性是客观实在性，这一特性既适用于自然领域的存在（如山川河流），也适用于社会领域的存在（如生产方式、社会关系），是二者的共同特性。（教材 P28-P29）","s":"2025 年 10 月第 4 题","y":"2025 年 10 月"},{"k":"p2510-4","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"马克思指出：“观念的东西不外是移入人脑并在人的头脑中改造过的物质的东西而已。”这就是说","o":["意识是人脑的分泌物","意识是客观世界的主观映象","意识是人脑的附属物","意识是客观世界的虚幻影像"],"a":1,"w":"马克思的这句话表明，意识的内容来源于客观物质世界，是人脑对客观事物的主观反映。意识并非人脑凭空产生，而是对物质的能动改造后的结果，既不是人脑的分泌物（庸俗唯物主义观点），也不是虚幻影像。（教材 P33）","s":"2025 年 10 月第 5 题","y":"2025 年 10 月"},{"k":"p2510-5","day":"d3","topic":"认识论与真理","cls":"zhe","q":"在唯物辩证法体系中，反映事物的过去、现在和将来关系的一对范畴是","o":["内容和形式","本质和现象","原因和结果","现实和可能"],"a":3,"w":"现实范畴反映事物当下的实际存在状态，可能范畴反映事物未来发展的潜在趋势，二者揭示了事物过去、现在与将来的联系。内容与形式反映事物的构成与表现方式，本质与现象反映事物的内在联系与外在表现，原因与结果反映事物的前后相继、引起与被引起关系。（教材 P54）","s":"2025 年 10 月第 6 题","y":"2025 年 10 月"},{"k":"p2510-6","day":"d3","topic":"认识论与真理","cls":"zhe","q":"“认识的本质是主体在实践基础上对客体的能动反映”，这是一种","o":["主观唯心主义认识论观点","客观唯心主义认识论观点","辩证唯物主义认识论观点","旧唯物主义认识论观点"],"a":2,"w":"辩证唯物主义认识论认为，认识的本质是主体在实践基础上对客体的能动反映，既强调实践的决定性作用，又承认认识的能动性。主观唯心主义认识论否认客观客体的存在，客观唯心主义认识论将认识归结为对绝对精神的把握，旧唯物主义认识论否认认识的能动性。（教材 P81-P82）","s":"2025 年 10 月第 7 题","y":"2025 年 10 月"},{"k":"p2510-7","day":"d3","topic":"认识论与真理","cls":"zhe","q":"轻视理性认识而片面夸大感性认识的作用，会导致实践中的","o":["实用主义","怀疑主义","教条主义","经验主义"],"a":3,"w":"经验主义片面夸大感性认识的作用，轻视理性认识的指导意义，认为只有感性经验才是可靠的认识来源。实用主义强调认识的实际效用，怀疑主义否认认识的可能性，教条主义片面夸大理性认识的作用，轻视感性经验。（教材 P87）","s":"2025 年 10 月第 8 题","y":"2025 年 10 月"},{"k":"p2510-8","day":"d3","topic":"认识论与真理","cls":"zhe","q":"实践是检验真理的唯一标准，这是因为","o":["实践是人类生存和发展的基础","实践是人类社会生活的本质","实践是真理和价值统一的基础","实践具有直接现实性的品质"],"a":3,"w":"实践之所以是检验真理的唯一标准，核心在于实践具有直接现实性——它能将主观认识转化为客观现实，通过实际结果验证认识是否符合客观规律。其他选项虽表述正确，但并非这一命题的根本原因。（教材 P101）","s":"2025 年 10 月第 9 题","y":"2025 年 10 月"},{"k":"p2510-9","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"中国共产党的思想路线的核心是","o":["自信自立","守正创新","实事求是","自我革命"],"a":2,"w":"中国共产党的思想路线是一切从实际出发，理论联系实际，实事求是，在实践中检验真理和发展真理。其中，实事求是是思想路线的核心。（教材 P117）","s":"2025 年 10 月第 10 题","y":"2025 年 10 月"},{"k":"p2510-10","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"社会历史观的基本问题是","o":["社会存在和社会意识的关系问题","物质文明和精神文明协调发展的问题","社会革命和社会改革的关系问题","群众、阶级、政党、领袖的关系问题"],"a":0,"w":"社会存在与社会意识的关系问题，是社会历史观的基本问题。正确认识社会存在与社会意识的关系，是科学把握人类社会发展规律的基础和前提。（教材 P126）","s":"2025 年 10 月第 11 题","y":"2025 年 10 月"},{"k":"p2510-11","day":"d4","topic":"唯物史观","cls":"zhe","q":"社会存在即社会物质生活条件，是社会生活的物质方面。下列选项中不属于社会存在的是","o":["自然地理环境","政治法律思想","物质生产方式","人口因素"],"a":1,"w":"社会存在包括自然地理环境、人口因素和物质生产方式（生产力与生产关系的统一）。政治法律思想属于社会意识的范畴，是上层建筑的重要组成部分。（教材 P127）","s":"2025 年 10 月第 12 题","y":"2025 年 10 月"},{"k":"p2510-12","day":"d4","topic":"唯物史观","cls":"zhe","q":"下列各项正确说明经济基础与上层建筑的关系的是","o":["经济基础的性质决定上层建筑的性质","上层建筑的性质决定经济基础的性质","上层建筑的变化决定经济基础的变化","上层建筑各个部分都随经济基础的变化而同步变化"],"a":0,"w":"经济基础与上层建筑的关系中，经济基础处于决定地位：经济基础的性质决定上层建筑的性质，经济基础的变化发展决定上层建筑的变化发展。上层建筑具有相对独立性，并非与经济基础同步变化，也不能决定经济基础。（教材 P142）","s":"2025 年 10 月第 13 题","y":"2025 年 10 月"},{"k":"p2510-13","day":"d5","topic":"商品与价值","cls":"jing","q":"从商品二因素与劳动二重性的关系考察商品经济中能够形成商品价值的劳动是","o":["具体劳动","体力劳动","抽象劳动","脑力劳动"],"a":2,"w":"商品二因素（使用价值和价值）对应劳动二重性（具体劳动和抽象劳动）。具体劳动创造商品的使用价值，抽象劳动（无差别的人类一般劳动）形成商品的价值。（教材 P189）","s":"2025 年 10 月第 14 题","y":"2025 年 10 月"},{"k":"p2510-14","day":"d5","topic":"商品与价值","cls":"jing","q":"下列关于商品价值量决定关系的表述中，正确的是","o":["商品的价值量与社会必要劳动时间成正比，与劳动生产率成反比","商品的价值量与社会必要劳动时间成反比，与劳动生产率成正比","商品的价值量与社会必要劳动时间成正比，与劳动生产率也成正比","商品的价值量与社会必要劳动时间成反比，与劳动生产率也成反比"],"a":0,"w":"商品的价值量由社会必要劳动时间决定，二者成正比——社会必要劳动时间越长，价值量越大。劳动生产率（单位时间内生产的商品数量）与价值量成反比——劳动生产率越高，单位商品耗费的社会必要劳动时间越少，价值量越小。（教材 P190）","s":"2025 年 10 月第 15 题","y":"2025 年 10 月"},{"k":"p2510-15","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"资本主义社会中，劳动力成为商品要具备的基础条件，不包括","o":["劳动者在法律上是自由人","劳动者人身依附于资本家","劳动者没有生活资料来源","劳动者没有任何生产资料"],"a":1,"w":"劳动力成为商品的两个基本条件：一是劳动者在法律上是自由人，能自主支配自己的劳动力；二是劳动者没有任何生产资料和生活资料，只能靠出卖劳动力为生。劳动者人身依附于资本家是封建制生产关系的特征，并非劳动力成为商品的条件。（教材 P208）","s":"2025 年 10 月第 16 题","y":"2025 年 10 月"},{"k":"p2510-16","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"资本主义社会经济危机会周期性爆发，但现实中资本主义的再生产周期不一定都要依次经过典型的四个阶段，其中有一个阶段是资本主义经济周期的必经阶段和基本阶段，这个阶段是","o":["危机阶段","萧条阶段","复苏阶段","高涨阶段"],"a":0,"w":"资本主义再生产周期包括危机、萧条、复苏、高涨四个阶段，其中危机阶段是必经阶段和基本阶段，是资本主义基本矛盾激化的集中表现，决定了周期的性质和进程。（教材 P228）","s":"2025 年 10 月第 17 题","y":"2025 年 10 月"},{"k":"p2510-17","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"资本主义国家政权采取分权制衡的组织形式，即三权分立制度，下列选项中不属于这“三权”的是","o":["监督权","司法权","行政权","立法权"],"a":0,"w":"三权分立制度中的“三权”指立法权、行政权和司法权，三者相互独立、相互制衡。监督权并非独立的“三权”之一，而是通过三权之间的制约关系实现的。（教材 P231）","s":"2025 年 10 月第 18 题","y":"2025 年 10 月"},{"k":"p2510-18","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"垄断资本主义形成于19世纪末20世纪初，由于这一时期的垄断资本主义主要以私人垄断资本为基础，因此又被称为","o":["私人垄断资本主义","垄断竞争资本主义","国家垄断资本主义","金融垄断资本主义"],"a":0,"w":"19世纪末20世纪初形成的垄断资本主义，以私人垄断资本为基础，称为私人垄断资本主义。国家垄断资本主义是二战后发展起来的，指国家政权与私人垄断资本相结合的垄断资本主义。（教材 P241）","s":"2025 年 10 月第 19 题","y":"2025 年 10 月"},{"k":"p2510-19","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"垄断资本主义国家的垄断组织虽然形式多种多样，但本质都是为了","o":["促进技术进步","获得垄断利润","控制销售市场","增加商品生产"],"a":1,"w":"垄断组织的形式（如卡特尔、辛迪加、托拉斯等）虽各不相同，但本质都是为了获取垄断利润——通过垄断价格（高于或低于生产价格的价格）实现的超额利润，是垄断资本主义的核心目标。（教材 P245）","s":"2025 年 10 月第 20 题","y":"2025 年 10 月"},{"k":"p2510-20","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"第二次世界大战后，资本主义生产资料所有制发生了新的变化，成为居主导地位的所有制形式是","o":["国家资本所有制","法人资本所有制","员工持股所有制","知识资本所有制"],"a":1,"w":"二战后，资本主义生产资料所有制发生新变化，法人资本所有制逐渐取代私人资本所有制，成为居主导地位的所有制形式。法人资本所有制是指法人股东（如企业法人、金融机构法人）控股的所有制形式。（教材 P262-P263）","s":"2025 年 10 月第 21 题","y":"2025 年 10 月"},{"k":"p2510-21","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"与通常意义上对金融资本概念的理解和使用不同，马克思主义政治经济学的金融资本概念有其独特内涵，它指的是垄断资本主义国家","o":["银行自有资本和借入资本的总和","银行和非银行金融机构资本的总和","资本市场上流通的所有货币资本的总和","工业垄断资本和银行垄断资本融合形成的垄断资本"],"a":3,"w":"马克思主义政治经济学中的金融资本，特指工业垄断资本和银行垄断资本在竞争中相互融合形成的新型垄断资本，并非泛指所有金融机构的资本或货币资本总和。（ const FX=(()=>{
  const cv=$('#fx'),ctx=cv.getContext('2d');let W=0,H=0,parts=[],run=false;
  function rs(){const r=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(r,0,0,r,0,0);}
  rs();addEventListener('resize',rs);
  const COL=['#7B61FF','#FF8FB1','#FFC83D','#1DBF94','#3AA8FF','#FF6B6B'];
  function add(p){parts.push(p);if(!run){run=true;requestAnimationFrame(tick);}}
  function burst(x,y,n=30,pw=1){if(REDUCE)n=Math.min(n,6);for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(2.5+Math.random()*6)*pw;
    add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3.5*pw,g:.22,r:Math.random()*6.3,vr:(Math.random()-.5)*.4,s:4+Math.random()*6,c:COL[i%6],sh:i%3,l:80+Math.random()*50});}}

  function star(s){ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?s*.42:s,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();}
  function tick(){ctx.clearRect(0,0,W,H);parts=parts.filter(p=>p.l>0&&p.y<H+40);
    for(const p of parts){p.vx*=.99;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l--;ctx.save();ctx.globalAlpha=Math.min(1,p.l/30);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;

    if(parts.length)requestAnimationFrame(tick);else{run=false;ctx.clearRect(0,0,W,H);}}
  function float(t,x,y,cls='xp'){const e=document.createElement('div');e.className='float '+cls;e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1050);}

  function combo(t){const e=document.createElement('div');e.className='combo-pop';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1150);}
  return {burst,rain,float,toast,shake,combo};

 ['clear','💥','错题终结者','把 5 道以上的错题本清空'],['streak3','📅','三天不断','连续 3 天完成今日冲刺'],['kit','🎒','万事俱备','勾完考试当天清单']];
function unlock(id){if(S.ach[id])return;S.ach[id]=todayStr();save();const a=ACH.find(x=>x[0]===id);

const TG={fc:10,bz:12,sq:1};
function bump(k,n=1){const d=daily();d[k]+=n;if(!d.done&&d.fc>=TG.fc&&d.bz>=TG.bz&&d.sq>=TG.sq){d.done=1;
  if(S.streak.last!==d.d){S.streak.n=S.streak.last===yestStr()?S.streak.n+1:1;S.streak.last=d.d;}save();
  if(S.streak.n>=3)unlock('streak3');
  setTimeout(()=>{sound('win');FX.rain(160);addXP(50);openModal(`${mascot('cheer','mid')}<h3 style="text-align:center">今日冲刺完成</h3><p class="mm" style="text-align:center">闪卡、闪电战、主观题全部达标。连续打卡 ${S.streak.n} 天，奖励 50 经验。</p><button class="btn full b-mint" data-close>收下</button>`,m=>{$('.mascot',m).style.margin='0 auto';});},900);}

function sayLine(){const d=daily(),l=daysLeft();if(l===null)return '先告诉我哪天考试吧';if(l<0)return '考试结束啦，辛苦了！';
  if(l===0)return '就是今天！每道题都写满';if(d.done)return '今天的冲刺完成啦，早点休息';if(l<=3)return '最后 '+l+' 天，清一清错题本';
  if(d.fc<TG.fc)return '先翻 '+(TG.fc-d.fc)+' 张闪卡热热身？';if(d.bz<TG.bz)return '来一轮闪电战，还差 '+(TG.bz-d.bz)+' 题';return '再拼一道主观题，今天就圆满了';}
function predict(){const t=S.st.t;if(t<20)return {need:20-t};const pm=S.st.r/t;let ps=null,how='';
  if(S.sub.t>0){ps=S.sub.s/S.sub.t;how='主观题按模拟考自评';}
  else{const ids=Object.keys(S.sq);if(ids.length>=3){ps=ids.reduce((a,k)=>a+S.sq[k],0)/(ids.length*3)*.85;how='主观题按拼图星级打八五折（认出来比写出来容易）';}}
  return {pm,ps,how,score:ps===null?null:Math.round(50*pm+50*ps)};}
function ring(ic,label,v,t,col,href){const p=Math.min(v/t,1),C=163.36;return `<a class="r3" href="#${href}">${v>=t?'<span class="ok">✓</span>':''}<div class="rw"><svg viewBox="0 0 64 64"><circle class="rt" cx="32" cy="32" r="26"/><circle class="rv" cx="32" cy="32" r="26" stroke="${col}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-o="${C*(1-p)}"/></svg><span class="ri">${ic}</span></div><span class="rl">${label}</span><span class="rc">${Math.min(v,t)}/${t}</span></a>`;}

  app.innerHTML=`<div class="hrow"><div class="streak ${streakNow()?'on':''}">🔥 <b>${streakNow()}</b> 天连续冲刺</div>
  <div class="hbtns"><button class="ib" id="bS" aria-label="音效">${S.sound?IC.son:IC.soff}</button><a class="ib" href="#settings" aria-label="设置">${IC.gear}</a></div></div>
  <section class="hero"><button class="board" id="bD"><span class="rings"><i></i><i></i></span>
   <span class="bh">${l===null?'还没设考试日':'距离自考还有'}</span><span class="bn ${l===null?'q':''}">${l===null?'?':Math.max(l,0)}</span><span class="bu">${l===null?'点我设置':'天'}</span></button>
   <div class="hm"><div class="say">${sayLine()}</div>${mascot('idle','big')}</div></section>
  <div class="lvbar"><span class="lvt">Lv${lv[0]} ${lv[1]}</span><div class="xpb"><i style="width:${pct}%"></i></div><span class="xpn">${S.xp}${nx?' / '+nx[2]:''}</span></div>
  <section class="today"><div class="sec-h"><h2>今日冲刺</h2><span>${d.done?'全部完成':[d.fc>=TG.fc,d.bz>=TG.bz,d.sq>=TG.sq].filter(Boolean).length+' / 3 达标'}</span></div>
   <div class="rings3">${ring('🃏','闪卡',d.fc,TG.fc,'#7B61FF','cards')}${ring('⚡','刷真题',d.bz,TG.bz,'#FFB800','blitz')}${ring('🧩','主观题',d.sq,TG.sq,'#1DBF94','sq')}</div></section>

/* ================= 闪卡 ================= */
let FCQ=null,FCG=null;
function fcQueue(){if(FCQ&&FCG===S.fcg)return FCQ;FCG=S.fcg;FCQ=CARDS.filter(c=>(S.fcg==='全部'||c.g===S.fcg)&&!S.fc[c.i]).map(c=>c.i);return FCQ;}
function vCards(){const q=fcQueue(),grp=CARDS.filter(c=>S.fcg==='全部'||c.g===S.fcg),mastered=grp.filter(c=>S.fc[c.i]).length;
  let body;
  if(!q.length)body=`<div class="fc-done">${mascot('cheer','mid')}<h2>这一组全部掌握</h2><p class="muted">${grp.length} 张都记住了。换一组，或者把这组重新过一遍。</p><div class="row"><button class="btn b-ghost" id="fR">这组再来一遍</button><button class="btn" id="fA">看全部闪卡</button></div></div>`;
  else{const c=CARDS[q[0]];body=`<div class="deck">${q.length>2?'<div class="fcard b2"></div>':''}${q.length>1?'<div class="fcard b1"></div>':''}
   <div class="fcard top in" id="top"><div class="flip"><div class="face front"><span class="chip c-${c.cls}">${c.g}</span><p class="fq">${c.q}</p><span class="fhint">点一下翻面，左右滑动分拣</span></div>
   <div class="face back"><span class="fa-l">${c.q}</span><p class="fa">${nl(c.a)}</p><p class="fm">💡 ${c.m}</p></div></div>
   <span class="stamp s-ok">记住了</span><span class="stamp s-no">再看看</span></div></div>
   <div class="fc-act"><button class="btn b-lemon" id="fN">再看看</button><button class="btn b-ghost" id="fF">翻面</button><button class="btn b-mint" id="fY">记住了</button></div>`;}
  app.innerHTML=topbar('闪卡翻翻乐','')+`<div class="chips">${GROUPS.map(g=>`<button class="fchip ${g===S.fcg?'on':''}" data-g="${g}">${g}</button>`).join('')}</div>
  <div class="fc-meta"><span>这一组已掌握 <b>${mastered}</b> / ${grp.length}</span><span>还剩 ${q.length} 张</span></div>${body}`;
  $$('.fchip').forEach(b=>b.onclick=()=>{S.fcg=b.dataset.g;save();FCQ=null;vCards();});
  const on=$('.fchip.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
  if(!q.length){$('#fR').onclick=()=>{grp.forEach(c=>delete S.fc[c.i]);save();FCQ=null;vCards();};$('#fA').onclick=()=>{S.fcg='全部';save();FCQ=null;vCards();};return;}
  const top=$('#top'),so=$('.s-ok',top),sn=$('.s-no',top);let sx=0,sy=0,dx=0,drag=false,moved=false;
  const flip=()=>{top.classList.toggle('flipped');sound('flip');};
  const go=dir=>{top.style.transition='transform .3s ease-in,opacity .3s';top.style.transform=`translateX(${dir*innerWidth}px) rotate(${dir*24}deg)`;top.style.opacity='0';
    const i=q.shift();if(dir>0){S.fc[i]=1;const [x,y]=ctr(top);FX.burst(x,y,22);sound('ok');addXP(3,x,y-60);bump('fc');
      const n=Object.keys(S.fc).length;if(n>=30)unlock('fc30');if(n>=CARDS.length)unlock('fcall');}else{q.push(i);sound('flip');}save();setTimeout(vCards,260);};
  top.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;dx=0;drag=true;moved=false;top.style.transition='none';});
  top.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(e.clientY-sy)){moved=true;try{top.setPointerCapture(e.pointerId);}catch(_){}}
    if(!moved)return;top.style.transform=`translateX(${dx}px) rotate(${dx*.06}deg)`;so.style.opacity=Math.max(0,Math.min(1,dx/90));sn.style.opacity=Math.max(0,Math.min(1,-dx/90));});
  const end=()=>{if(!drag)return;drag=false;top.style.transition='';if(moved&&dx>100)go(1);else if(moved&&dx<-100)go(-1);else{top.style.transform='';so.style.opacity=0;sn.style.opacity=0;if(!moved)flip();}};
  top.addEventListener('pointerup',end);top.addEventListener('pointercancel',()=>{drag=false;top.style.transition='';top.style.transform='';so.style.opacity=0;sn.style.opacity=0;});
  $('#fF').onclick=flip;$('#fY').onclick=()=>go(1);$('#fN').onclick=()=>go(-1);}

function vSQ(id){const s=SQM[id];if(!s){location.hash='sq';return;}const n=s.points.length;

  <div class="paper" id="pp">${slots.map((_,i)=>`<button class="slot" data-s="${i}"><span class="sn">（${i+1}）</span><span class="sv"></span></button>`).join('')}</div>
  <div class="pool" id="pl">${pool.map((t,i)=>`<button class="pchip" data-c="${i}">${t}</button>`).join('')}</div>
  <button class="btn full" id="go" disabled>交卷看分</button><div id="rs"></div>`;
  const draw=()=>{$$('.slot').forEach((b,i)=>{const c=slots[i];b.classList.toggle('f',c!==null);$('.sv',b).textContent=c===null?'':pool[c];});
    $$('.pchip').forEach(b=>b.classList.toggle('used',slots.includes(+b.dataset.c)));$('#go').disabled=slots.includes(null);};
  $$('.pchip').forEach(b=>b.onclick=()=>{const i=slots.indexOf(null);if(i<0)return;slots[i]=+b.dataset.c;sound('tap');draw();});
  $$('.slot').forEach(b=>b.onclick=()=>{if($('#pp').dataset.done)return;const i=+b.dataset.s;if(slots[i]===null)return;slots[i]=null;draw();});
  $('#go').onclick=()=>{$('#pp').dataset.done=1;$('#go').remove();$('#pl').remove();
    let good=0;$$('.slot').forEach((b,i)=>{const ok=s.points.includes(pool[slots[i]]);if(ok)good++;b.classList.remove('f');b.classList.add(ok?'ok':'bad');});
    const miss=s.points.filter(p=>!slots.map(c=>pool[c]).includes(p));const lost=n-good;const st=lost===0?3:lost===1?2:good>=Math.ceil(n/2)?1:0;

     ${miss.length?`<p class="muted small" style="margin-top:6px">漏掉的采分点：</p><div class="miss" style="justify-content:center">${miss.map(m=>`<span>${m}</span>`).join('')}</div>`:''}</div>
     <div class="tip">💡 <span>${s.tip}</span></div>

     <div class="row2"><button class="btn b-ghost" id="re">再拼一次</button><button class="btn" id="nt">下一道</button></div>`;
    setTimeout(()=>{if(st>=2){FX.burst(x,innerHeight*.35,st===3?60:30);sound(st===3?'win':'ok');}else{sound('bad');}},250);
    $('#cz').onclick=()=>{const ab=$('#ab'),on=ab.classList.toggle('cloze');$('#cz').classList.toggle('on',on);$('#cz').textContent=on?'显示全部':'遮住关键词背一遍';$$('mark',ab).forEach(m=>m.classList.remove('rv'));};

    $('#re').onclick=()=>vSQ(id);const ix=SQ.findIndex(q=>q.id===id);$('#nt').onclick=()=>{location.hash='sq/'+SQ[(ix+1)%SQ.length].id;};};}

  openModal(`<h3>确定交卷吗？</h3><p class="mm">${warn?warn+'。选择题不倒扣分，没把握也涂一个。':'全部作答完毕。'}剩余时间 ${mmss(R.remain)}。</p><div class="mbtns"><button class="btn b-ghost" data-close>再检查一下</button><button class="btn b-coral" id="ok">交卷</button></div>`,
  (m,close)=>{$('#ok',m).onclick=()=>{close();doSubmit(id);};});}
function doSubmit(id){clearInterval(exTimer);const e=EXM[id],R=S.run;if(!R||R.done)return;let r=0;
  e.mc.forEach((q,i)=>{S.st.t++;if(R.mc[i]===q.a){S.st.r++;r++;killWrong(q.k);}else markWrong(q.k);});
  R.done=1;R.mcScore=r*2;R.g={};save();location.hash='exam/'+id+'/grade';}
function gauge(val,max,col){const C=Math.PI*100;return `<div class="gauge"><svg viewBox="0 0 240 140"><path class="gt" d="M20 125A100 100 0 0 1 220 125"/><path class="gv" d="M20 125A100 100 0 0 1 220 125" stroke="${col}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-o="${C*(1-val/max)}"/>${max===100?'<line x1="89" y1="30" x2="94" y2="46" stroke="#2A1F45" stroke-width="4" stroke-linecap="round"/><text x="84" y="22" font-size="12" font-weight="900" fill="#2A1F45">60</text>':''}</svg><div class="gn"><b class="cnt" data-v="${val}">0</b><span>满分 ${max}</span></div></div>`;}
function runGauge(){requestAnimationFrame(()=>setTimeout(()=>{$$('.gv').forEach(p=>p.style.strokeDashoffset=p.dataset.o);$$('.cnt').forEach(el=>{const v=+el.dataset.v,t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/1300);el.textContent=Math.round(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);});},80));}
function vGrade(id){const e=EXM[id],R=S.run;if(!R||R.id!==id||!R.done){location.hash='exam';return;}
  const items=[...e.sa.map((sid,i)=>({key:'s'+i,s:SQM[sid],no:26+i,txt:R.sa[i]})),...e.lun.map((sid,i)=>({key:'l'+i,s:SQM[sid],no:31+i,txt:R.lun[i].t,c:R.lun[i].c})).filter(x=>x.c)];
  const sc=it=>{const g=R.g[it.key]||[];if(it.s.sc)return Math.min(it.s.max,g.reduce((a,j)=>a+it.s.sc[j],0));return Math.round(it.s.max*g.length/it.s.points.length);};
  const wrong=e.mc.map((q,i)=>({q,i,p:R.mc[i]})).filter(x=>x.p!==x.q.a);
  app.innerHTML=topbar(e.name+' 成绩','exam')+`<div class="res">${gauge(R.mcScore,50,'#7B61FF')}<h2>选择题 ${R.mcScore} 分</h2><p class="muted small">答对 ${R.mcScore/2} 道，错的已进错题本</p></div>
  <div class="sec-h" style="margin-top:20px"><h2>主观题自评</h2><span>勾出你写到的采分点</span></div>
  ${R.lun.filter(x=>x.c).length<2?'<p class="sq-hint">论述只选了 '+R.lun.filter(x=>x.c).length+' 道，没选的按 0 分算。</p>':''}
  ${items.map(it=>`<div class="gradec" data-k="${it.key}"><div class="gh"><p>${it.no}．${it.s.stem}</p><span class="sc"><b>0</b>/${it.s.max}</span></div>
   <details><summary>看看我写的</summary><pre>${(it.txt||'（没有作答）').replace(/</g,'&lt;')}</pre></details>
   ${it.s.points.map((p,j)=>`<label class="ck"><input type="checkbox" data-j="${j}" ${(R.g[it.key]||[]).includes(j)?'checked':''}><span>${p}${it.s.sc?'<b style="color:var(--vio-d)">（'+it.s.sc[j]+' 分）</b>':''}</span></label>`).join('')}
   <details><summary>参考答案</summary><div class="ans" style="margin-top:6px;box-shadow:none;padding:4px 0"><div class="body">${hl(it.s.full)}</div></div></details></div>`).join('')}
  <button class="btn full b-mint" id="tot" style="margin-top:16px">算总分</button><div id="total"></div>
  ${wrong.length?`<div class="sec-h" style="margin-top:22px"><h2>选择题错了 ${wrong.length} 道</h2></div><div class="wl">${wrong.map(w=>`<div class="witem"><span class="chip c-${w.q.cls}">第 ${w.i+1} 题</span><p class="wq">${w.q.q}</p><p class="wa">正确：${L[w.q.a]}. ${w.q.o[w.q.a]}${w.p>=0?`<span style="color:var(--coral-d)">　你涂了 ${L[w.p]}</span>`:'<span style="color:var(--coral-d)">　没涂</span>'}</p><p class="ww">${w.q.w}</p></div>`).join('')}</div>`:''}`;
  runGauge();
  const upd=()=>$$('.gradec').forEach(c=>{const it=items.find(x=>x.key===c.dataset.k);$('.sc b',c).textContent=sc(it);});upd();
  $$('.gradec input').forEach(ch=>ch.onchange=()=>{const k=ch.closest('.gradec').dataset.k,j=+ch.dataset.j;const g=R.g[k]||(R.g[k]=[]);if(ch.checked){if(!g.includes(j))g.push(j);sound('tap');}else g.splice(g.indexOf(j),1);save();upd();});
  $('#tot').onclick=()=>{const sub=items.reduce((a,it)=>a+sc(it),0),tot=R.mcScore+sub,pass=tot>=60;
    const rec=S.ex[id]||{best:0,n:0};rec.n++;rec.best=Math.max(rec.best,tot);rec.last=tot;rec.date=todayStr();S.ex[id]=rec;
    S.sub.t+=50;S.sub.s+=sub;unlock('exam');if(pass)unlock('pass');S.run=null;save();addXP(80+(pass?50:0));
    $('#tot').remove();$('#total').innerHTML=`<div class="card" style="margin-top:16px;text-align:center">${gauge(tot,100,pass?'#1DBF94':'#FF9F43')}
     <h2 style="font-size:22px;font-weight:900;margin-top:4px">${pass?'过线了！':'离 60 分还差 '+(60-tot)+' 分'}</h2>
     <p class="muted small" style="margin:6px 0 4px">选择 ${R.mcScore} ＋ 主观 ${sub}。${pass?'保持这个状态进考场。':'主观题多写一条要点，差距最容易补。'}</p>
     <p class="muted small">采分点按比例估分，实际阅卷常有酌情分。</p></div>
     <div class="row2"><a class="btn b-ghost" href="#">回基地</a><a class="btn" href="#wrong">去清错题本</a></div>`;
    runGauge();setTimeout(()=>{if(pass){FX.rain(200);sound('win');}else sound('ok');},900);
    setTimeout(()=>$('#total').scrollIntoView({behavior:'smooth',block:'start'}),100);};}

/* ================= 错题本 ================= */
function vWrong(){const ks=Object.keys(S.wrong).filter(k=>Q[k]);
  if(!ks.length){app.innerHTML=topbar('错题本','')+`<div class="empty">${mascot('happy','mid')}<h2>错题本是空的</h2><p>去做一套模拟考，看看还有哪里会错。</p><a class="btn" href="#exam">去模拟考场</a></div>`;return;}
  app.innerHTML=topbar('错题本','',`<span class="chip c-ke">${ks.length} 道</span>`)+`<div class="intro">每道错题在闪电战里<b>答对一次</b>就会被消灭。清空之后，选择题就稳了。</div>
  <button class="btn full b-coral" id="rw" style="margin:14px 0">重刷错题本</button><div class="wl">${ks.map(k=>wItem(Q[k])).join('')}</div>`;
  $('#rw').onclick=()=>startBZ('wrong',shuffle(ks).slice(0,30));}

/* ================= 考场锦囊 ================= */
const KOU=[['zhe','三大规律','对立统一：动力和源泉；质量互变：状态和形式；否定之否定：趋势和道路'],['zhe','总特征与核心','总观点、总特征＝联系和发展；实质、核心＝对立统一'],
 ['zhe','认识论四象限','从天上掉下来：客观唯心；人脑自生：主观唯心；直观反映：旧唯物；能动反映：辩证唯物'],['zhe','感性与理性','感觉、知觉、表象是感性；概念、判断、推理是理性'],
 ['zhe','决定与影响','物质资料生产方式起决定作用；地理环境、人口只能影响和制约'],['jing','三组「二」','商品二因素：使用价值／价值；劳动二重性：具体／抽象劳动；基本矛盾：私人／社会劳动'],
 ['jing','两把尺子','按增殖作用分不变／可变资本；按周转方式分固定／流动资本'],['jing','空间并存，时间继起','产业资本顺利循环的两个条件，别写反'],
 ['jing','垄断从松到紧','短期价格协定→卡特尔→辛迪加→托拉斯→康采恩→混合联合公司'],['ke','科社「第一」','宣言＝公开问世；巴黎公社＝第一次尝试；苏维埃俄国＝第一个国家；最高理想＝共产主义']];
const KITL=['准考证（提前打印）','身份证','2B 铅笔两支（涂答题卡）','橡皮','黑色签字笔两支','看时间用的普通手表（按考点规定）','提前 30 分钟到考点'];

const PLAN=[[999,'每天一套整卷','上午或晚上抽 150 分钟，按真实考试流程做一套模拟卷，交卷后对着采分点自评。5 套卷用 5 天。'],
 [5,'主观题过两遍','把 40 道主观题拼图都做一遍，拿不到 3 星的，开「遮住关键词」背到能说出来。'],
 [3,'清错题本','只刷错题本，答对一道消灭一道，清空为止。闪卡把没掌握的翻完。'],
 [1,'只看锦囊','不做新题。看十句口诀、四条铁律，勾完考试当天清单，早睡。']];
function planH(){const l=daysLeft();return `<section class="kit-sec"><h2>最后几天怎么排${l!==null&&l>=0?'　<span class="muted small">还剩 '+l+' 天</span>':''}</h2><div class="tl">${PLAN.map((p,i)=>{const nx=PLAN[i+1];const on=l!==null&&l<=p[0]&&(!nx||l>nx[0]);
  return `<div style="--c:${on?'var(--coral)':'var(--vio)'}"><b>${i===0?'剩 6 天以上':i===PLAN.length-1?'考前 1 天':'剩 '+p[0]+'—'+(nx[0]+1)+' 天'}　${p[1]}${on?'　<span class="chip c-ke">现在</span>':''}</b><span>${p[2]}</span></div>`;}).join('')}</div></section>`;}
function vKit(){const col={zhe:'var(--vio)',jing:'var(--orange)',ke:'var(--pink)'};const done=KITL.filter((_,i)=>S.kit[i]).length;
  app.innerHTML=topbar('考场锦囊','')+planH()+`<section class="kit-sec"><h2>150 分钟怎么分</h2><div class="tl">
   <div style="--c:var(--vio)"><b>0—35 分钟　选择题</b><span>25 道，平均一分半一道。拿不准的先涂一个，做记号，最后回来看。</span></div>
   <div style="--c:var(--mint)"><b>35—85 分钟　简答题</b><span>5 道，每道 10 分钟。先写（1）（2）（3），再往里填。</span></div>
   <div style="--c:var(--orange)"><b>85—130 分钟　论述题</b><span>三道都读完，挑两道。每道写「原理＋意义」两段。</span></div>
   <div style="--c:var(--pink)"><b>130—150 分钟　检查</b><span>答题卡有没有漏涂，论述是不是两段都写满了。</span></div></div></section>
  <section class="kit-sec"><h2>动笔四条铁律</h2>
   <div class="rule"><span class="re">✏️</span><div><b>先写序号，再填内容</b><span>空着的序号会逼你想出下一点，宁可多写一条。</span></div></div>
   <div class="rule"><span class="re">🎯</span><div><b>每点先写判断句</b><span>「社会存在决定社会意识」放最前面，解释放后面。</span></div></div>
   <div class="rule"><span class="re">📑</span><div><b>论述写两段</b><span>原理答「是什么」，意义答「有什么用、怎么做」。</span></div></div>
   <div class="rule"><span class="re">🔀</span><div><b>三选二，先读完再动笔</b><span>挑能写满两段的两道，别在第一道上死磕。</span></div></div></section>
  <section class="kit-sec"><h2>十句救命口诀</h2>${KOU.map(k=>`<div class="kou" style="--c:${col[k[0]]}"><b>${k[1]}</b><span>${k[2]}</span></div>`).join('')}</section>
  <section class="kit-sec"><h2>考试当天清单　<span class="muted small">${done}/${KITL.length}</span></h2>${KITL.map((t,i)=>`<label class="ck"><input type="checkbox" data-i="${i}" ${S.kit[i]?'checked':''}><span>${t}</span></label>`).join('')}</section>`;
  $$('.kit-sec .ck input').forEach(c=>c.onchange=()=>{S.kit[c.dataset.i]=c.checked?1:0;save();sound('tap');if(KITL.every((_,i)=>S.kit[i])){unlock('kit');FX.burst(...ctr(c),40);}vKitCount();});}
function vKitCount(){const h=$$('.kit-sec h2')[4];if(h)$('span',h).textContent=KITL.filter((_,i)=>S.kit[i]).length+'/'+KITL.length;}

/* ================= 成就 / 设置 ================= */
function vAch(){app.innerHTML=topbar('成就','')+`<p class="sq-hint">已解锁 ${Object.keys(S.ach).length} / ${ACH.length}</p><div class="ach-grid">${ACH.map(a=>`<div class="ach ${S.ach[a[0]]?'':'lock'}"><div class="md">${a[1]}</div><b>${a[2]}</b><span>${a[3]}</span></div>`).join('')}</div>`;}
function vSettings(){app.innerHTML=topbar('设置','')+`<div class="set"><label>考试日期<input type="date" id="sd" value="${S.date}"></label>
  <label>音效<input type="checkbox" class="sw" id="ss" ${S.sound?'checked':''}></label><label>震动<input type="checkbox" class="sw" id="sv" ${S.vib?'checked':''}></label>
  <div class="sr"><span>清空全部进度</span><button class="btn btn-sm b-coral" id="rst">清空</button></div></div>
  <p class="about">题目来源：选择题全部为 2017—2026 年历年真题原题，答案以试卷所附答案为准；带解析的题目为资料官方解析或整理编写。五套整卷中 2024 年 4 月、2024 年 10 月、2025 年 4 月三套的主观题答案与分值来自官方「答案及评分参考」。估分仅供参考。</p>`;
  $('#sd').onchange=e=>{S.date=e.target.value;save();FX.toast('考试日期已保存');};$('#ss').onchange=e=>{S.sound=e.target.checked?1:0;save();};$('#sv').onchange=e=>{S.vib=e.target.checked?1:0;save();if(S.vib)vib(40);};
  $('#rst').onclick=()=>openModal(`<h3>清空全部进度？</h3><p class="mm">闪卡、错题本、经验、成就和考试记录都会删除，不能恢复。</p><div class="mbtns"><button class="btn b-ghost" data-close>取消</button><button class="btn b-coral" id="y">清空</button></div>`,(m,close)=>{$('#y',m).onclick=()=>{const d=S.date;S=fresh();S.date=d;save();close();location.hash='';render();};});}

/* ================= 路由 ================= */
const ROUTES=[[/^$/,vHome],[/^cards$/,vCards],[/^blitz$/,vBlitz],[/^blitz\/play$/,vBZPlay],[/^blitz\/done$/,vBZDone],[/^sq$/,vSQList],[/^sq\/(\w+)$/,vSQ],
 [/^exam$/,vExamList],[/^exam\/(p\d+)$/,vExam],[/^exam\/(p\d+)\/grade$/,vGrade],[/^wrong$/,vWrong],[/^kit$/,vKit],[/^ach$/,vAch],[/^settings$/,vSettings]];
function render(){clearInterval(exTimer);const h=location.hash.replace(/^#\/?/,'');for(const [re,fn] of ROUTES){const m=h.match(re);if(m){fn(...m.slice(1));
  app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter');window.scrollTo(0,0);return;}}vHome();}
addEventListener('hashchange',render);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
daily();save();render();
</script></body></html>
